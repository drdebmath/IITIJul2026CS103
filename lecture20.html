    <section class="course-extra-slide course-bridge-slide course-fill-text" data-markdown data-mascot-target="p:nth-of-type(3) strong" data-mascot-say="Which one runs?"><textarea data-template>
## Where Lecture 19 ended · Which function runs?

A `SearchTree` is a `BinaryTree` (Lecture 19), so `grow(BinaryTree& t)` accepts it. Inside `grow`, the base class operation ran and broke the invariant: `contains(99)` gave `0`.

A derived function with the same name only **hides** the base one. Through a `BinaryTree&`, the base version still runs.

**Today's question.** Can the object choose its own function? Plan: virtual functions, late binding, abstract classes, virtual destructors, and a factory function.
    </textarea></section>
    <section class="course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="One word: virtual."><textarea data-template>
## Virtual functions · The object chooses the function

~~~cpp
class BinaryTree {
public:    virtual void add(int v);       // any tree: a new leftmost leaf
protected: std::unique_ptr<Node> root;    // also: size(), a virtual destructor
};
class SearchTree : public BinaryTree {  // invariant: smaller left, larger right
public:    void add(int v) override;      // ordered: keeps the invariant
           bool contains(int v) const;
};
void grow(BinaryTree& t) { t.add(99); }   // which add()?
int main() { SearchTree t;  for (int v : {50, 30, 70}) t.add(v);  grow(t);
    std::cout << "size " << t.size()
              << ", contains(99) " << t.contains(99) << '\n';
}   // with virtual: size 4, contains(99) 1 · without virtual: contains(99) 0
~~~

    <section class="course-extra-slide course-syntax-slide" data-course-syntax="20" data-markdown data-mascot-target="table" data-mascot-say="virtual in the base, override in the derived."><textarea data-template>
## Virtual functions: the general form

| Part | Meaning |
| --- | --- |
| `virtual void f();` in `Base` | A **virtual function**: a derived class may **override** it. |
| `void f() override;` in `Derived` | Overrides `Base::f`; the compiler checks that the name and parameters match. |
| `Base& r = d;  r.f();` | **Late binding**: the function is chosen at run time from the object, here `Derived::f`. |
| `virtual double area() const = 0;` | A **pure virtual function**: no definition in the base class; a derived class must override it. |
| **Abstract class** | A class with a pure virtual function; no object of it can be created. |
| `virtual ~Base() = default;` | A **virtual destructor**: `delete` through a `Base*` runs the derived destructor first. |
    </textarea></section>
    <section class="course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="Early or late?"><textarea data-template>
## Late binding · Dynamic dispatch at run time

~~~cpp
class Base {
public: void early() const { std::cout << "Base::early\n"; }      // not virtual
        virtual void late() const { std::cout << "Base::late\n"; }  // virtual
        virtual ~Base() = default;
};
class Derived : public Base {
public: void early() const { std::cout << "Derived::early\n"; }      // hides
        void late() const override { std::cout << "Derived::late\n"; }
};
int main() { Derived d;  Base& r = d;  // reference type Base; object: a Derived
    r.early();       // Base::early     early binding: from the type of r

## Abstract classes · A pure virtual function is a promise

~~~cpp
class Shape {                                 // abstract class
public:
    virtual double area() const = 0;          // pure virtual function
    virtual std::string name() const = 0;
    virtual ~Shape() = default;
};
class Square : public Shape {                 // Circle is written the same way
public:
    explicit Square(double s) : side(s) {}
    double area() const override { return side * side; }
    std::string name() const override { return "square"; }
private: double side; };
void report(const Shape& s) {                 // written once, for every shape
    std::cout << s.name() << " area " << s.area() << '\n'; }
// report(sq): square area 16 · report(c): circle area 3.14159
// Shape s;   error: variable type 'Shape' is an abstract class

## New class, old code unchanged · Triangle

~~~cpp
class Triangle : public Shape {                // new derived class
public:
    Triangle(double b, double h) : base(b), height(h) {}
    double area() const override { return 0.5 * base * height; }
    std::string name() const override { return "triangle"; }
private: double base, height;
};
int main() { Square sq(4.0);  Triangle tr(3.0, 4.0);
    report(sq);          // square area 16
    report(tr);          // triangle area 6      report() was not edited
}
~~~

**Takeaways:** `report` uses only the `Shape` interface. **Polymorphism**: one call, many behaviors.

## Virtual destructors · Release through a base pointer

~~~cpp
class Shape {
public: virtual ~Shape() { std::cout << "~Shape()\n"; }    // virtual destructor
        virtual double area() const = 0;
};
class Square : public Shape {
public: explicit Square(double s) : side(s) { std::cout << "Square()\n"; }
        ~Square() override { std::cout << "~Square()\n"; }
        double area() const override { return side * side; }
private: double side; };
int main() { std::unique_ptr<Shape> p = std::make_unique<Square>(4.0);
    std::cout << "area " << p->area() << '\n';
    std::cout << "end of main\n";
}   // Square(), area 16, end of main, ~Square(), ~Shape()
    // without virtual on ~Shape(): undefined behavior
~~~

<figure class="course-stepper" data-course-stepper>
<svg class="course-array-address-figure course-l20dtor-figure" viewBox="0 0 900 380" role="img" aria-label="A step-by-step trace of the program that makes a unique_ptr&lt;Shape&gt; p own a Square object, in 6 frames. The stack holds p; the free store holds the Square object, drawn as an outer box with a Shape part and a Square part holding the data member side = 4. Frame 1: make_unique&lt;Square&gt;(4.0) creates the object, the Square constructor prints Square(), and p owns it. Frame 2: p-&gt;area() is a virtual call, Square::area runs, and the output adds area 16. Frame 3: the output adds end of main and the object is still alive. Frame 4: at the closing brace p is destroyed and deletes the object through a Shape pointer; the destructor is virtual, so ~Square() runs first, the output adds ~Square(), and the Square part is shown dashed red. Frame 5: then the base class destructor ~Shape() runs, the output adds ~Shape(), and the whole object is dashed red and released: derived first, base last. Frame 6: without virtual on ~Shape(), deleting through a Shape pointer is undefined behavior; the Shape part is destroyed but ~Square() may never run." xmlns="http://www.w3.org/2000/svg">

## Dahl and Nygaard · Where virtual functions came from

<div class="course-story-layout">
<div>

- 1960s: Ole-Johan Dahl and Kristen Nygaard design Simula I and Simula 67 at the Norwegian Computing Center, Oslo. Simula 67 has classes, subclasses, and virtual procedures.
- 1983: Bjarne Stroustrup adds virtual functions to C++, crediting Simula.
- 2001 ACM A.M. Turing Award to Dahl and Nygaard.

**Lesson:** the word `virtual` you type today is a Simula idea from 1967.

## Factory functions · One place chooses the class

~~~cpp
std::unique_ptr<Shape> makeShape(char kind, double size) {
    if (kind == 's') return std::make_unique<Square>(size);
    if (kind == 'c') return std::make_unique<Circle>(size);
    return nullptr;                           // unknown kind: a null pointer
}
int main() {
    for (char kind : std::string("scx")) {
        std::unique_ptr<Shape> p = makeShape(kind, 2.0);
        if (p) std::cout << kind << ": area " << p->area() << '\n';
        else   std::cout << kind << ": unknown kind\n";
    }
}   // s: area 4 · c: area 12.5664 · x: unknown kind
~~~

## Multiple inheritance · Virtual inheritance shares one base

~~~cpp
class Device  { public: Device() { std::cout << "Device()\n"; }  int id = 7; };
class Printer : public virtual Device {      // virtual base class
public: void print() const { std::cout << "print on device " << id << '\n'; } };
class Scanner : public virtual Device {
public: void scan() const  { std::cout << "scan on device " << id << '\n'; } };
class Copier  : public Printer, public Scanner {};     // multiple inheritance
int main() { Copier c;                // Device()   once: one shared Device part
    c.print();  c.scan();             // print on device 7, scan on device 7
    std::cout << c.id << '\n';        // 7
}   // without virtual: Device() runs twice and c.id is an error:
    // non-static member 'id' found in multiple base-class subobjects
~~~

    <section data-markdown data-mascot-target="table" data-mascot-say="One idea each."><textarea data-template>
## Common errors · Virtual functions

| Error | Example | Result |
|---|---|---|
| Forget `virtual` in the base class | `void add(int v);` in `BinaryTree` | the base version runs through a `BinaryTree&`; no error message |
| Parameters do not match | `void late() override;` for `void late() const;` | with `override`: compile error; without it: a new function, not an override |
| Pass by value | `void show(Animal a)` called with a `Dog` | **slicing**: only the `Animal` part is copied; `Animal::speak` runs |
| Create an abstract class object | `Shape s;` | `variable type 'Shape' is an abstract class` |
| No virtual destructor | `delete` a `Square` through a `Shape*` | undefined behavior; the compiler may only warn |
    </textarea></section>

## Questions about virtual functions

| Question | Answer |
|---|---|
| Must the derived class write `virtual` again? | No. A function that overrides a virtual function is virtual. Write `override`. |
| Why is every function not virtual? | A virtual call costs a little more, and each object carries one extra pointer. In C++ you ask for it. |
| Does late binding work with an object, not a reference? | No. `Base b = d;` copies only the base part (slicing). Use a reference or a pointer. |
| Can an abstract class have data members and defined functions? | Yes. Only the pure virtual functions lack a definition. |
| What is private inheritance? | `class D : private B` hides the interface of `B`: not is-a. Prefer composition. |
| How do we keep many shapes in one `vector`? | `std::vector<std::unique_ptr<Shape>>`: Lecture 21. |
    </textarea></section>
    <section class="course-fill-text-sm" data-markdown data-mascot-target="li:first-child" data-mascot-say="The object decides."><textarea data-template>
## Summary: virtual functions and polymorphism

- A **virtual function** is chosen at run time from the object: **late binding**.
- A **pure virtual function** (`= 0`) makes an **abstract class**.
- A base class with virtual functions needs a **virtual destructor**.
- **Polymorphism**: code for the base class works for every derived class; a **factory function** chooses the class.

**Reading:** Stroustrup, *PPP* (2nd ed.), “Graphics Class Design”, sections “Overriding” and “Pure virtual functions”; Savitch, “Inheritance”, section “Polymorphism”.
