# Lecture 20: Select runtime behavior through safe interfaces

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## The caller depends on an abstraction. · Create notifications through one interface

A factory returns a base pointer; virtual dispatch selects the concrete notification without conditionals at the call site.

~~~cpp
#include <memory>
#include <string>

class Notifier {
public:
    virtual std::string send() const = 0;
    virtual ~Notifier() = default;
};
class Email : public Notifier {
public:
    std::string send() const override { return "email sent"; }
};

std::unique_ptr<Notifier> makeNotifier() {
    return std::make_unique<Email>();
}
~~~

**Takeaways**

- The caller depends on an abstraction.
- Virtual dispatch replaces type-switching.
- The factory centralizes object creation.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="20" data-markdown><textarea data-template>
## The general form of a virtual function, an override, and an interface

~~~cpp
class <Base> {
public:
    virtual <return type> <operation>() = 0;   // pure virtual: no default behavior
    virtual ~<Base>() = default;               // required to delete through a base pointer
};

class <Derived> : public <Base> {
public:
    <return type> <operation>() override;      // override: the compiler checks the match
};

<Base>* <p> = new <Derived>();
<p>-><operation>();     // selects <Derived>'s version from the runtime type
delete <p>;             // safe only because ~<Base>() is virtual
~~~

| Part | Meaning |
| --- | --- |
| <code>virtual</code> | The call selects the override from the object's runtime type, not from the pointer's declared type. |
| <code>= 0</code> | Makes the class abstract: it cannot be instantiated, and every derived type must supply the operation. |
| <code>override</code> | Optional but always worth writing — a signature that fails to match becomes a compile error instead of a silent second function. |
| `virtual ~<Base>()` | Without it, `delete <p>` through a base pointer is undefined and the derived part is never destroyed. |
| slicing | Copying a `<Derived>` into a `<Base>` <em>value</em> discards the derived part. Use a pointer or reference. |

Polymorphism needs a pointer or a reference: a by-value `<Base>` can only ever behave as a `<Base>`.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Public and private inheritance make different interface promises

- Public inheritance preserves the base interface and models is-a.
- Private inheritance is an implementation technique and does not promise substitutability.

Composition is usually clearer than private inheritance.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Virtual inheritance shares one common base in a diamond

Multiple inheritance gives one derived class more than one direct base.

In a diamond, virtual inheritance can share one common base subobject. Use these mechanisms only when the domain model genuinely requires them; they are not the starting point for polymorphism.
    </textarea></section>

## A virtual function selects the override from the runtime type

~~~cpp
class Shape {
public:
    virtual double area() const = 0;
    virtual ~Shape() = default;
};

class Square : public Shape {
    double side;
public:
    explicit Square(double s) : side(s) {}
    double area() const override { return side * side; }
};
~~~
    </textarea></section>
    <section data-markdown><textarea data-template>
## A virtual destructor makes base-pointer deletion safe

~~~cpp
std::unique_ptr<Shape> shape = std::make_unique<Square>(4.0);
double result = shape->area();
~~~

The virtual destructor makes deletion through the base interface safe. Lecture 21 will place differently typed objects in one owning container.

## A factory centralizes construction behind the interface

~~~cpp
std::unique_ptr<Shape> makeSquare(double side) {
    return std::make_unique<Square>(side);
}
~~~

A factory returns an abstraction while choosing a concrete type in one place.

    <section class="course-extra-slide course-game-evolution-slide" data-markdown><textarea data-template>
## Game evolution: One interface selects an actor at runtime

| Today's concept | Exact game part enabled |
|---|---|
| virtual dispatch, base ownership, and factory | create one concrete actor while the game uses only its interface |

~~~cpp
#include <cassert>
#include <memory>
struct Actor { virtual char mark() const=0; virtual ~Actor()=default; };
struct Snake:Actor { char mark() const override { return 'S'; } };
std::unique_ptr<Actor> makeSnake() {
    return std::make_unique<Snake>();
}
int main() {
    std::unique_ptr<Actor> actor=makeSnake();
    assert(actor->mark()=='S');
}
~~~

**Substitution test:** <code>main</code> never needs the concrete type after construction.

**Next unlock · L21:** own several differently typed actors in one world.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Every derived type must pass the base-level tests

For every derived type, test:

- calls made through a base reference;
- cleanup through base ownership;
- invalid constructor inputs;
- behavior added by a new derived type without changing existing callers.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Interfaces, safe ownership, and substitutability earn polymorphism

- Public inheritance promises substitutability.
- Dynamic dispatch selects an override at runtime.
- Polymorphic bases need virtual destructors.
- Own derived objects with smart pointers.
- Factories separate construction choice from use.
    </textarea></section>
