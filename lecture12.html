## Example: assert a pre-condition of divide

~~~cpp
#include <cassert>
#include <iostream>

// pre-condition: denominator != 0
int divide(int numerator, int denominator) {
    assert(denominator != 0);
    return numerator / denominator;
}

int main() {
    std::cout << divide(7, 2) << '\n';    // pre-condition holds: prints 3
    std::cout << divide(10, 0) << '\n';   // violates the pre-condition
}
~~~

~~~text
3
Assertion failed: (denominator != 0), function divide, file div.cpp, line 6.
~~~

The program aborts at the violated pre-condition instead of dividing by zero. On Linux, glibc prints <code>div: div.cpp:6: int divide(int, int): Assertion &#96;denominator != 0' failed.</code>
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="12" data-markdown><textarea data-template>
## The assert macro and a test driver

~~~cpp
#include <cassert>

<return type> <name>(<parameters>) {
    assert(<pre-condition>);     // what the caller must already guarantee
    // body may now rely on <pre-condition> being true
}

void <test name>() {                                  // one test = one claim
    assert(<name>(<known input>) == <expected result>);
    assert(<name>(<boundary value>) == <expected result>);
}

// test driver: main() calls each test; reaching the end means every assert held
~~~

| Part | Meaning |
| --- | --- |
| `assert(<pre-condition>)` | Checks a caller obligation at run time. It aborts on failure, so the error is reported where it was detected. |
| `<known input>` | An input whose correct answer you worked out by hand, independently of the code. |
| `<boundary value>` | The smallest, largest, or just-valid input, where off-by-one and precision errors live. Invalid input belongs to the pre-condition, not to a test. |
| failure | An assert prints the expression, file, and line, then aborts. That location is where the error was detected, not necessarily its cause. |
| `NDEBUG` | Defined (e.g. `-DNDEBUG`), it removes every assert. Never put work the program needs inside one. |

A test that cannot fail proves nothing: write the input whose expected answer you knew before you ran the program.
    </textarea></section>

## Test divide with a test driver

~~~cpp
#include <cassert>
#include <iostream>

// pre-condition: denominator != 0
int divide(int numerator, int denominator) {
    assert(denominator != 0);
    return numerator / denominator;
}

void testDivide() {               // test driver
    assert(divide(7, 2) == 3);    // integer division
    assert(divide(-7, 2) == -3);  // truncates toward zero
    assert(divide(0, 5) == 0);    // zero numerator is fine
}

int main() {
    testDivide();
    std::cout << "all tests passed\n";
    std::cout << divide(10, 0) << '\n';   // violates the pre-condition
}
~~~

~~~text
all tests passed
Assertion failed: (denominator != 0), function divide, file div.cpp, line 6.
~~~

The program aborts at the violated pre-condition instead of dividing by zero. When output goes to an IDE panel or a pipe, the assertion message may appear before <code>all tests passed</code>.
    </textarea></section>

## Check pre-conditions with assert, user input with if · Average marks without dividing by zero

~~~cpp
#include <cassert>
#include <iostream>
#include <vector>

// pre-condition: values is not empty
// post-condition: returns the mean of values
double average(const std::vector<int>& values) {
    assert(!values.empty());                 // empty would divide by zero
    long long sum = 0;
    for (int value : values) sum += value;
    return static_cast<double>(sum) / values.size();
}

void testAverage() {                         // test driver
    assert(average({1, 2}) == 1.5);          // catches integer division
    assert(average({90}) == 90.0);           // one value
}

int main() {
    testAverage();
    std::vector<int> marks;
    int mark = 0;
    while (std::cin >> mark && mark != -1) marks.push_back(mark);
    if (marks.empty()) {                     // user input: check with if
        std::cout << "no marks entered\n";
        return 1;
    }
    std::cout << "average: " << average(marks) << '\n';
}
~~~

| Input | Output |
|---|---|
| <code>72 65 88 -1</code> | <code>average: 75</code> |
| <code>-1</code> | <code>no marks entered</code> |

**Takeaways**

- <code>assert</code> catches programmer errors: a caller that breaks the pre-condition.
- Check user input with <code>if</code>: the user did nothing wrong, and <code>NDEBUG</code> would remove an assert.
- <code>main</code> checks the pre-condition before calling <code>average</code>, so the assert never fires on real input.
- The test driver runs first, on inputs whose answers were worked out by hand.
    </textarea></section>

## Compile-time, link-time, run-time, and logic errors

| Kind of error | Example | Who reports it |
|---|---|---|
| Compile-time (syntax or type) | `int x = "5";` | the compiler, with a file and line |
| Link-time | `int area(int);` is declared and called, never defined | the linker: `undefined reference to area(int)` |
| Run-time | `v.at(0)` on an empty vector | the running program: `std::out_of_range` exception |
| Logic | `double avg = sum / count;` with two `int`s | nobody: the program prints a wrong value |

The kind of error tells you where to look next.
    </textarea></section>

## Reading compiler error messages

1. Go to the first error message and the line it names.
2. Read the complete message, not only “error.”
3. Inspect the line immediately before it too.
4. Make one small change.
5. Recompile before changing anything else.

Fix the first error first: later messages are often caused by it.
    </textarea></section>

## Tracing variables

~~~cpp
std::vector<int> values{4, 7, 2};   // expected total: 13
int total = 0;
for (int i = 1; i < 3; ++i) {       // total ends at 9
    total += values[i];
}
~~~

Record <code>i</code>, <code>values[i]</code>, and <code>total</code> after every iteration, by hand or with output statements.

| Iteration | Expected <code>i</code>, <code>values[i]</code>, <code>total</code> | Observed |
|---|---|---|
| 1 | 0, 4, 4 | **1, 7, 7** ← first difference |
| 2 | 1, 7, 11 | 2, 2, 9 |
| 3 | 2, 2, 13 | loop already ended |

The first wrong row locates the logic error: the loop starts at index 1, not 0.
    </textarea></section>

## Testing with boundary values

For an average function, test:

| Test case | Error it can expose |
|---|---|
| empty input | violated pre-condition: the assert aborts, so this is not a test case |
| one value | smallest valid size |
| two unequal integers | integer division |
| values near <code>INT_MAX</code> | overflow in an <code>int</code> sum |
| maximum expected count | wrong loop bound |

Write each valid test case as an <code>assert</code>: a debug run stops at the first one that fails.

## The corrected average function

~~~cpp
double average(const std::vector<int>& values) {
    assert(!values.empty());
    long long sum = 0;
    for (int value : values) sum += value;
    return static_cast<double>(sum) / values.size();
}
~~~

- <code>assert</code> states the pre-condition, so an empty vector is reported instead of divided by.
- <code>long long</code> keeps a large sum from overflowing <code>int</code>.
- The cast makes the division floating-point, so 1 and 2 average to 1.5.
    </textarea></section>

## Questions about assert (1)

| Question | Answer |
|---|---|
| Why not write `if (denominator == 0)` instead? | `if` handles situations the program should expect, such as bad input. `assert` checks what can never happen in correct code: a caller broke the contract. It stops where the bug was detected, and `NDEBUG` removes it. |
| What does `divide(10, 0)` do when asserts are removed? | Undefined behaviour. On x86 Linux it usually crashes with `Floating point exception`; on ARM (Apple Silicon) it quietly returns 0. Never rely on either. |
| How does `assert` know the file and line? | It is a macro, expanded where you wrote it, so it records `__FILE__`, `__LINE__`, and the condition as text. |
| Can an assert carry a message? | Yes: `assert(denominator != 0 && "denominator must be nonzero");`. A string literal is always true, so the check is unchanged and the message appears in the failure. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Questions about assert (2)

| Question | Answer |
|---|---|
| In my IDE the assertion message appeared before `all tests passed`. Why? | `std::cout` buffers output when it is not writing to a terminal, and `abort()` does not flush that buffer, while the assertion message is written at once. Use `std::endl`, or `std::cerr` for diagnostics. |
| Why is `-7 / 2` equal to −3, not −4? | Integer division truncates toward zero (since C++11). Likewise `-7 % 2` is `-1`: the remainder takes the sign of the dividend. |
| Is `average({1, 2}) == 1.5` safe with `==`? | Here, yes: 1.5 is stored exactly. In general compare with a tolerance, e.g. `std::abs(x - expected) < 1e-9`. |
| How do I test that `average({})` fails? | Not with an assert: the program aborts. An empty vector violates the pre-condition, so it is not a test case. |
| Is there a check that runs at compile time? | Yes, `static_assert` checks a constant expression while compiling. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Questions about the examples

| Question | Answer |
|---|---|
| Why does `main` return 1 when no marks are entered? | A nonzero exit status tells the shell or a calling script that the program failed. Check it with `echo $?`. |
| Why use `long long` for the sum? | Adding `int` values near `INT_MAX` overflows, and signed overflow is undefined behaviour. The wider type leaves room. |
| Is `at()` throwing an exception like an assert? | Similar in spirit: both detect a bad index or value at run time. An exception can be caught and handled; exceptions come later in the course. |
| Isn't an infinite loop a run-time error? | In this classification it is a logic error: nothing crashes or reports a problem, the program just does not do what you meant. |
    </textarea></section>

## Set A · Section A: True or False

*Write T or F, with a one-line reason naming the C++ rule.*

| Q | Statement | Answer | Reason |
|---|---|---|---|
| 1 | The expression `7 / 2` has type `int` when both operands are `int`. | T | `int / int` is integer division, so `7 / 2` is the `int` 3. |
| 2 | A variable declared inside a pair of braces remains in scope after the closing brace. | F | A name declared in a block goes out of scope at the closing brace. |
| 3 | In `a != 0 && 20 / a > 2`, the division is not evaluated when `a` is zero. | T | `&&` short-circuits: when `a != 0` is false, `20 / a` is never evaluated. |
| 4 | A `do-while` loop always executes its body at least once. | T | The condition is tested after the body, so the body runs before the first test. |
| 5 | If a function receives an `int` by value, changing the parameter changes the caller's variable. | F | Pass by value copies the argument; the parameter is a separate local variable. |
| 6 | Two functions can be overloaded when they have the same parameter list but different return types. | F | Overloads must differ in their parameter lists; the return type alone cannot tell two calls apart. |
| 7 | For an array of size 5, index 5 is the last valid index. | F | Valid indices are 0 to 4; index 5 is one past the end. |
| 8 | `std::vector<int> v;` initially contains zero elements. | T | A default-constructed vector is empty: `v.size()` is 0. |
| 9 | `std::string::find` returns `std::string::npos` when the requested text is absent. | T | `find` returns `std::string::npos` when there is no match. |
| 10 | A recursive function needs a base case and recursive calls that make progress toward it. | T | Without a base case, or without progress toward it, no call ever returns: the recursion runs until the stack overflows. |
    </textarea></section>

## Set A · C1: Array statistics through references

~~~cpp
double summarize(const array<int,5>& a, int& lo, int& hi) {
    lo = a[0];                                   // 1
    hi = a[0];                                   // 2
    int sum = 0;
    for (int value : a) {
        sum += value;                            // 3
        if (value < lo) lo = value;              // 4
        if (value > hi) hi = value;              // 5
    }
    return static_cast<double>(sum) / a.size();  // 6
}

int main() {
    array<int,5> a{8, 3, 11, 6, 2};
    int lo, hi;
    double mean = summarize(a, lo, hi);          // 7
    cout << lo << ' ' << hi << ' ' << mean;      // 8
}
~~~

- Blanks 1 and 2 start from a real element. Starting `lo` at 0 gives the wrong minimum, because no value here is below 0.
- Blank 6 may also be `5`. Blank 7 passes `lo` and `hi` themselves; the reference parameters bind to them.

## Set A · C2: Recursive sum of the first n numbers

~~~cpp
int sumTo(int n) {
    if (n == 0) return 0;          // 1
    return n + sumTo(n - 1);       // 2
}

int main() {
    int n = 5;
    int answer = sumTo(n);         // 3
    if (answer > 10) {
        cout << answer;            // 4
    } else {
        cout << 0;
    }
    cout << '\n';                  // 5
    return 0;                      // 6
}
~~~

- The base case returns 0, the sum of no numbers. Each call adds `n` and recurses on `n - 1`, which moves toward the base case.

## Set A · C3: String validation and counting

~~~cpp
int main() {
    string s = "CS103-A7";
    size_t dash = s.find('-');                         // 1
    if (dash == string::npos) {                        // 2
        cout << "bad\n";
        return 0;
    }
    string left = s.substr(0, dash);                   // 3
    int digits = 0;
    for (size_t i = dash + 1; i < s.size(); ++i) {     // 4
        if (isdigit(static_cast<unsigned char>(s[i])))
            ++digits;                                  // 5
    }
    cout << left << ' ' << digits;                     // 6
}
~~~

- `substr(0, dash)` takes `dash` characters, which is exactly the part before the dash.
- Blank 4 may also be `length`. Blank 5 may be `digits++` or `digits += 1`.

## Set A · Section E: Output and final values

*Give the requested result.*

| 6 | `int f(int n){if(n<=1)return 1; return n*f(n-1);}` → `f(4)` | 24 | 4 × 3 × 2 × 1. |

## Set B · Section A: True or False

*Write T or F, with a one-line reason naming the C++ rule.*

| Q | Statement | Answer | Reason |
|---|---|---|---|
| 1 | After `double x = 7 / 2;`, `x` stores `3.5`. | F | `7 / 2` is integer division (3), so `x` stores 3.0. |

| 3 | In an `if`–`else if`–`else` chain, at most one branch executes. | T | The first true condition's branch runs and the rest are skipped. |
| 4 | A `while` loop can execute zero times. | T | The condition is tested first; if it is false, the body never runs. |
| 5 | A reference parameter can modify the caller's variable. | T | A reference is an alias, so assigning through it changes the caller's variable. |
| 6 | A function declaration allows a call to appear before the function definition. | T | A declaration makes the name and parameter types known before the definition. |
| 7 | A range-based `for` can visit every element of an array without manually writing an index. | T | `for (int x : a)` visits each element in order with no index. |
| 8 | In a two-dimensional array `a[r][c]`, both indices are checked against the row count. | F | The first index ranges over rows and the second over columns; a built-in array checks neither at run time. |
| 9 | `getline(cin, s)` can read spaces into `s`. | T | `getline` reads up to the newline, spaces included, unlike `>>`. |
| 10 | A recursive call that moves away from every base case can still be guaranteed to terminate. | F | A call that moves away from every base case never reaches one: the recursion runs until the stack overflows. |

## Set B · C1: Search an array using a function

~~~cpp

    for (size_t i = 0; i < a.size(); ++i) {  // 1

}

## Set B · C2: Recursive power

~~~cpp
int power(int base, int exp) {
    if (exp == 0) return 1;                  // 1
    return base * power(base, exp - 1);      // 2, 3
}

int main() {
    int value = power(3, 3);                 // 4
    cout << value << '\n';                   // 5
    return 0;                                // 6
}
~~~

- The base case returns 1, because any base to the power 0 is 1. Returning 0 would make every product 0.
- `exp - 1` moves each call toward the base case.
- Blank 5 may also be `value << endl`.

## Questions about the midsem (1)

| Question | Answer |
|---|---|
| Set B D9 (`int m[rows][3]`) compiles with my g++. Why N? | The paper assumes C++17, and standard C++ requires array sizes to be compile-time constants. g++ and clang accept it only as an extension; `-pedantic-errors` rejects it. |
| Set A D4: isn't calling `area` before its definition a link error? | No. The compiler rejects the call because no declaration of `area` is visible there. A link error is something declared but never defined. |
| Set A D6: both are arrays of `double`. Why no compile? | For `std::array` the size is part of the type: `array<double,7>` and `array<double,5>` are unrelated types, and neither converts to the other. |
| Set B D5: two `f` functions return different types. Isn't that overloading? | No. Overloads must differ in their parameter lists. A call `f(3)` cannot be resolved by return type, so the second definition is an error. |
