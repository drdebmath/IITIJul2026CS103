## Example: assert a pre-condition of divide

~~~cpp
#include <cassert>
#include <iostream>

// pre-condition: denominator != 0
int divide(int numerator, int denominator) {
    assert(denominator != 0);
    return numerator / denominator;
}

void testDivide() {               // test driver
    assert(divide(7, 2) == 3);    // integer division
    assert(divide(-7, 2) == -3);  // truncates toward zero
    assert(divide(0, 5) == 0);    // zero numerator is fine
}

int main() {
    testDivide();
    std::cout << "all tests passed\n";
    std::cout << divide(10, 0) << '\n';   // violates the pre-condition
}
~~~

~~~text
all tests passed
Assertion failed: (denominator != 0), function divide, file div.cpp, line 6.
~~~

The program aborts at the violated pre-condition instead of dividing by zero. On Linux, g++ prints <code>Assertion &#96;denominator != 0' failed</code> with the same file and line.
    </textarea></section>

## The assert macro and a test driver

~~~cpp
#include <cassert>

<return type> <name>(<parameters>) {
    assert(<pre-condition>);     // what the caller must already guarantee
    // body may now rely on <pre-condition> being true
}

void <test name>() {                                  // one test = one claim
    assert(<name>(<known input>) == <expected result>);
    assert(<name>(<boundary value>) == <expected result>);
}

// test driver: main() calls each test; reaching the end means every assert held
~~~

| Part | Meaning |
| --- | --- |
| `assert(<pre-condition>)` | Checks a caller obligation at run time. It aborts on failure, so the error is reported where it was detected. |
| `<known input>` | An input whose correct answer you worked out by hand, independently of the code. |
| `<boundary value>` | The empty, smallest, largest, or just-invalid input, where off-by-one and precision errors live. |
| failure | An assert prints the expression, file, and line, then aborts. That location is where the error was detected, not necessarily its cause. |
| `NDEBUG` | Defined (e.g. `-DNDEBUG`), it removes every assert. Never put work the program needs inside one. |

A test that cannot fail proves nothing: write the input whose expected answer you knew before you ran the program.
    </textarea></section>

## Check pre-conditions with assert, user input with if · Average marks without dividing by zero

~~~cpp
#include <cassert>
#include <iostream>
#include <vector>

// pre-condition: values is not empty
// post-condition: returns the mean of values
double average(const std::vector<int>& values) {
    assert(!values.empty());                 // empty would divide by zero
    long long sum = 0;
    for (int value : values) sum += value;
    return static_cast<double>(sum) / values.size();
}

void testAverage() {                         // test driver
    assert(average({1, 2}) == 1.5);          // catches integer division
    assert(average({90}) == 90.0);           // one value
}

int main() {
    testAverage();
    std::vector<int> marks;
    int mark = 0;
    while (std::cin >> mark && mark != -1) marks.push_back(mark);
    if (marks.empty()) {                     // user input: check with if
        std::cout << "no marks entered\n";
        return 1;
    }
    std::cout << "average: " << average(marks) << '\n';
}
~~~

| Input | Output |
|---|---|
| <code>72 65 88 -1</code> | <code>average: 75</code> |
| <code>-1</code> | <code>no marks entered</code> |

**Takeaways**

- <code>assert</code> catches programmer errors: a caller that breaks the pre-condition.
- Check user input with <code>if</code>: the user did nothing wrong, and <code>NDEBUG</code> would remove an assert.
- <code>main</code> checks the pre-condition before calling <code>average</code>, so the assert never fires on real input.
- The test driver runs first, on inputs whose answers were worked out by hand.
    </textarea></section>

## Compile-time, link-time, run-time, and logic errors

| Kind of error | Example | Who reports it |
|---|---|---|
| Compile-time (syntax or type) | `int x = "5";` | the compiler, with a file and line |
| Link-time | `int area(int);` is declared and called, never defined | the linker: `undefined reference to area(int)` |
| Run-time | `v.at(0)` on an empty vector | the running program: `std::out_of_range` exception |
| Logic | `double avg = sum / count;` with two `int`s | nobody: the program prints a wrong value |

The kind of error tells you where to look next.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Reading compiler error messages

1. Go to the first error message and the line it names.
2. Read the complete message, not only “error.”
3. Inspect the line immediately before it too.
4. Make one small change.
5. Recompile before changing anything else.

Fix the first error first: later messages are often caused by it.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Tracing variables

~~~cpp
std::vector<int> values{4, 7, 2};   // expected total: 13
int total = 0;
for (int i = 1; i < 3; ++i) {       // prints 9
    total += values[i];
}
~~~

Record <code>i</code>, <code>values[i]</code>, and <code>total</code> after every iteration, by hand or with output statements.

| Iteration | Expected <code>i</code>, <code>values[i]</code>, <code>total</code> | Observed |
|---|---|---|
| 1 | 0, 4, 4 | **1, 7, 7** ← first difference |
| 2 | 1, 7, 11 | 2, 2, 9 |
| 3 | 2, 2, 13 | loop already ended |

The first wrong row locates the logic error: the loop starts at index 1, not 0.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Testing with boundary values

For an average function, test:

| Test case | Error it can expose |
|---|---|
| empty input | violated pre-condition: no average exists |
| one value | smallest valid size |
| two unequal integers | integer division |
| values near <code>INT_MAX</code> | overflow in an <code>int</code> sum |
| maximum expected count | wrong loop bound |

Write each test case as an <code>assert</code>: a debug run stops at the first one that fails.
    </textarea></section>
    <section data-markdown><textarea data-template>
## The corrected average function

~~~cpp
double average(const std::vector<int>& values) {
    assert(!values.empty());
    long long sum = 0;
    for (int value : values) sum += value;
    return static_cast<double>(sum) / values.size();
}
~~~

- <code>assert</code> states the pre-condition, so an empty vector is reported instead of divided by.
- <code>long long</code> keeps a large sum from overflowing <code>int</code>.
- The cast makes the division floating-point, so 1 and 2 average to 1.5.
    </textarea></section>

## Summary: errors, debugging, and testing

- Identify the kind of error before editing.
- Fix the first compiler error first.
- Trace variables to find the first wrong value.
- Test boundary values with <code>assert</code> and a test driver.
- Check pre-conditions; state post-conditions.
- Change one thing at a time, then retest.

## Set A · Section A: True or False

| Q | Answer | Reason |
|---|---|---|
| 1 | T | `int / int` is integer division, so `7 / 2` is the `int` 3. |
| 2 | F | A name declared in a block goes out of scope at the closing brace. |
| 3 | T | `&&` short-circuits: when `a != 0` is false, `20 / a` is never evaluated. |
| 4 | T | The condition is tested after the body, so the body runs before the first test. |
| 5 | F | Pass by value copies the argument; the parameter is a separate local variable. |
| 6 | F | Overloads must differ in their parameter lists; the return type alone cannot tell two calls apart. |
| 7 | F | Valid indices are 0 to 4; index 5 is one past the end. |
| 8 | T | A default-constructed vector is empty: `v.size()` is 0. |
| 9 | T | `find` returns `std::string::npos` when there is no match. |
| 10 | T | Without a base case, or without progress toward it, no call ever returns: the recursion runs until the stack overflows. |
    </textarea></section>

## Set A · C1: Array statistics through references

~~~cpp
double summarize(const array<int,5>& a, int& lo, int& hi) {
    lo = a[0];                                   // 1
    hi = a[0];                                   // 2
    int sum = 0;
    for (int value : a) {
        sum += value;                            // 3
        if (value < lo) lo = value;              // 4
        if (value > hi) hi = value;              // 5
    }
    return static_cast<double>(sum) / a.size();  // 6
}

int main() {
    array<int,5> a{8, 3, 11, 6, 2};
    int lo, hi;
    double mean = summarize(a, lo, hi);          // 7
    cout << lo << ' ' << hi << ' ' << mean;      // 8
}
~~~

- Blanks 1 and 2 start from a real element. Starting `lo` at 0 gives the wrong minimum, because no value here is below 0.
- Blank 6 may also be `5`. Blank 7 passes `lo` and `hi` themselves; the reference parameters bind to them.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Set A · C2: Recursive sum of the first n numbers

~~~cpp
int sumTo(int n) {
    if (n == 0) return 0;          // 1
    return n + sumTo(n - 1);       // 2
}

int main() {
    int n = 5;
    int answer = sumTo(n);         // 3
    if (answer > 10) {
        cout << answer;            // 4
    } else {
        cout << 0;
    }
    cout << '\n';                  // 5
    return 0;                      // 6
}
~~~

- The base case returns 0, the sum of no numbers. Each call adds `n` and recurses on `n - 1`, which moves toward the base case.
- Blank 5 may also be `endl` or `"\n"`.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Set A · C3: String validation and counting

~~~cpp
int main() {
    string s = "CS103-A7";
    size_t dash = s.find('-');                         // 1
    if (dash == string::npos) {                        // 2
        cout << "bad\n";
        return 0;
    }
    string left = s.substr(0, dash);                   // 3
    int digits = 0;
    for (size_t i = dash + 1; i < s.size(); ++i) {     // 4
        if (isdigit(static_cast<unsigned char>(s[i])))
            ++digits;                                  // 5
    }
    cout << left << ' ' << digits;                     // 6
}
~~~

- `substr(0, dash)` takes `dash` characters, which is exactly the part before the dash.
- Blank 4 may also be `length`. Blank 5 may be `digits++` or `digits += 1`.
    </textarea></section>

## Set B · Section A: True or False

| Q | Answer | Reason |
|---|---|---|
| 1 | F | `7 / 2` is integer division (3), so `x` stores 3.0. |
| 2 | F | `++i` yields the new value; `i++` yields the old value. |
| 3 | T | The first true condition's branch runs and the rest are skipped. |
| 4 | T | The condition is tested first; if it is false, the body never runs. |
| 5 | T | A reference is an alias, so assigning through it changes the caller's variable. |
| 6 | T | A declaration makes the name and parameter types known before the definition. |
| 7 | T | `for (int x : a)` visits each element in order with no index. |
| 8 | F | `r` is checked against the row count and `c` against the column count; a built-in array checks neither at run time. |
| 9 | T | `getline` reads up to the newline, spaces included, unlike `>>`. |
| 10 | F | A call that moves away from every base case never reaches one: the recursion runs until the stack overflows. |

## Set B · C1: Search an array using a function

~~~cpp
int firstIndex(const array<int,6>& a, int key) {
    for (size_t i = 0; i < a.size(); ++i) {  // 1
        if (a[i] == key) {                   // 2
            return static_cast<int>(i);      // 3
        }
    }
    return -1;                               // 4
}

int main() {
    array<int,6> a{4, 9, 2, 9, 7, 1};
    int p = firstIndex(a, 9);                // 5
    if (p != -1) cout << p;                  // 6
    else cout << "missing";
    cout << '\n';                            // 7
    return 0;                                // 8
}
~~~

- Returning at the first match gives index 1, not the later 9 at index 3.
- `return -1` belongs after the loop. Inside the loop, it would give up after checking only `a[0]`.
- Blank 1 may also be `6`. Blank 7 may be `endl` or `"\n"`.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Set B · C2: Recursive power

~~~cpp
int power(int base, int exp) {
    if (exp == 0) return 1;                  // 1
    return base * power(base, exp - 1);      // 2, 3
}

int main() {
    int value = power(3, 3);                 // 4
    cout << value << '\n';                   // 5
    return 0;                                // 6
}
~~~

- The base case returns 1, because any base to the power 0 is 1. Returning 0 would make every product 0.
- `exp - 1` moves each call toward the base case.
- Blank 5 may also be `value << endl`.
    </textarea></section>

## Set B · C3: Vector totals and a string length

~~~cpp
int main() {
    vector<int> marks;
    marks.push_back(72);                              // 1
    marks.push_back(65);                              // 2
    int total = 0;
    for (size_t i = 0; i < marks.size(); ++i) {       // 3
        total += marks[i];                            // 4
    }
    string label = "Total";
    cout << label.size() << ' ' << total << '\n';     // 5
    return 0;                                         // 6
}
~~~

- `marks` starts empty, so `push_back` is the only way to add 72 and then 65.
- Blank 5 may also be `length`; `"Total"` has 5 characters.
    </textarea></section>
