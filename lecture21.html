# Programming with AI Agents

<p class="course-title-tagline">The future of programming, and what stays yours</p>

<p class="course-title-instructor">Dr. Debasish Pattanayak · <a href="https://drdebmath.github.io">drdebmath.github.io</a></p>
    </textarea></section>
    <section class="course-extra-slide course-bridge-slide course-fill-text" data-markdown data-mascot-target="p:nth-of-type(3) strong" data-mascot-say="What comes next?"><textarea data-template>
## Where Lecture 20 ended · What comes next?

In Lecture 20 you wrote a pure virtual function: a promise that every derived class must keep. In twenty lectures you went from your first program to class hierarchies. You can now read, test, and explain a C++ program.

Today an AI agent can write such a program in minutes.

**Today's question.** What does programming become, and what stays yours? Plan: what agents built this year, how an agent works, how to work with one, what goes wrong when nobody checks, your role.
    </textarea></section>
    <section class="course-extra-slide course-story-slide" data-course-story="ai-projects" data-markdown data-mascot-target="p strong" data-mascot-say="Open the demo!"><textarea data-template>
## AI in real projects · Built by agents

- [Portals](https://portals-endless-worlds.netlify.app) (Ethan Mollick, 2026): from one paragraph, teams of Claude agents build over 450 linked 3D worlds; "the quality of some seemed a little uneven".
- [Weltendämmerung](https://s-macke.github.io/weltendaemmerung/) (2025–26): a Commodore 64 game ported to the browser with an AI agent in three days; the AI "can be sloppy", so a person verifies.
- [A C compiler](https://www.anthropic.com/engineering/building-c-compiler) (2026): 16 Claude agents, 100,000 lines; it builds Linux 6.9 and runs Doom; "not yet a drop-in replacement".
- [Vibe Jam 2026](https://vibejam.com/): browser games with at least 90% of the code written by AI.

**Lesson:** striking demos in days, each with a stated limit; no finished AAA game yet.
    </textarea></section>
    <section class="course-extra-slide course-story-slide" data-course-story="ai-projects" data-markdown data-mascot-target="p strong" data-mascot-say="Tests decided."><textarea data-template>
## AI in real projects · Rewrites judged by tests

- 2025: as new Android code moves from C and C++ to Rust, a language whose compiler rejects most out-of-bounds and lifetime errors, memory-safety errors fall below 20% of Android's vulnerabilities for the first time (Google).
- 2025: the Git project announces that "Rust will become mandatory in Git 3.0".
- 2026: Ladybird ports about 25,000 lines of its JavaScript engine from C++ to Rust in about two weeks with AI assistants: 52,898 conformance tests, 0 regressions.
- 2026: Bun ports 535,496 lines from Zig to Rust in 11 days with about 64 Claude agents; its existing test suite finds 19 regressions, all corrected.

**Lesson:** each rewrite was judged by tests written before the AI wrote a line.
    </textarea></section>

## Demo · One folder, one agent

~~~text
median-project/                 # a git repository with one commit
  median.h      the specification: pre-condition and post-condition
  median.cpp    the draft:  return v[v.size() / 2];
  tests.cpp     three assert tests, written before the draft
  AGENTS.md     five rules for the agent

$ g++ -std=c++17 -Wall median.cpp tests.cpp && ./a.out
Assertion failed: (median({4, 1, 3, 2}) == 2.5),
    function main, file tests.cpp, line 8.
~~~

1. Start a command-line agent in the folder and type the prompt on the next slide.
1. Watch what it reads, what it runs, and what it asks permission for.
1. When it reports success, run `git diff`, then compile and run the tests yourself.
1. `git checkout median.cpp` restores the draft, so that you can try another prompt.

The four files: [median.h](codes/lecture-21-median-project/median.h) · [median.cpp](codes/lecture-21-median-project/median.cpp) · [tests.cpp](codes/lecture-21-median-project/tests.cpp) · [AGENTS.md](codes/lecture-21-median-project/AGENTS.md)

## What an agent is · A model in a loop with tools

~~~text
$ cd median-project             # median.cpp, tests.cpp, AGENTS.md
$ agent                         # for example: claude, or codex
> median() fails the even-count test. Correct it.
> Do not change tests.cpp.
  read  AGENTS.md, median.cpp, tests.cpp
  run   g++ -std=c++17 -Wall median.cpp tests.cpp && ./a.out
        Assertion failed: (median({4, 1, 3, 2}) == 2.5)
  edit  median.cpp              # allow this edit? y
  run   g++ -std=c++17 -Wall median.cpp tests.cpp && ./a.out
        all tests passed
$ git diff                      # you read what changed
~~~

## Working with an agent: the general form

| Part | Meaning |
| --- | --- |
| **Goal** | What must be true at the end: a specification with a pre-condition and a post-condition (Lecture 12). |
| **Context** | The files to read and the rules of the project, written once in `AGENTS.md`. |
| **Check** | A command the agent can run to see whether it is done: `g++ -std=c++17 -Wall`, then your tests. |
| **Plan** | For a large task, ask for a plan first; correct the plan before any code is written. |
| **Small steps** | One change at a time, each one verified; commit with `git` when the tests pass. |
| **Permission** | The agent asks before it edits a file or runs a command; read the request before you allow it. |
| **Review** | Read `git diff`; you can explain every line; your name is on it. |
    </textarea></section>
    <section class="course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="Leave nothing to guess."><textarea data-template>
## Prompts · Bad versus good

~~~text
BAD   fix my median function its not working

GOOD  median() in median.cpp fails the third test in tests.cpp:     # evidence
          Assertion failed: (median({4, 1, 3, 2}) == 2.5)
      Goal: for an even count, return the mean of the two           # goal
      middle values. Pre-condition: v is not empty. C++17.
      Do not change tests.cpp or the signature of median().         # limits
      Check: g++ -std=c++17 -Wall median.cpp tests.cpp && ./a.out   # check
      must print "all tests passed". Then say what you changed.     # report
~~~

The bad prompt leaves the agent to guess which input is wrong, what correct means, what it may change, and when it is done. The good prompt leaves nothing to guess.

## Demo · How the runs were made

| | Small model | Local model | Large model |
| --- | --- | --- | --- |
| **Model** | LFM 2.5, 2.6 billion parameters, hosted | LFM 2.5, 8 billion parameters, on a laptop | Claude Fable 5.2, hosted |
| **Agent program** | `pi` | `pi` | Claude Code |
| **Command** | `pi -p "prompt"` | `pi -p "prompt"` | `claude -p "prompt"` |

1. Each run starts in a fresh copy of the folder: `git clone median-project run1`.
1. The prompt is the bad prompt or the good prompt of the previous slide, word for word.
1. After the run, a person runs `git diff` and the tests: the verdict on the next two slides comes from the tests, not from the agent's report.
    </textarea></section>
    <section class="course-extra-slide" data-markdown data-mascot-target="table" data-mascot-say="Short prompt, clear context."><textarea data-template>
## Same prompts, two agents · What happened

| | Small model · 2.6 billion parameters | Large model · Claude Fable 5.2 |
| --- | --- | --- |
| **Bad prompt** | Reports "The fix is complete", but it edited a `median.cpp` in a different folder. The test still fails. | Corrects `median.cpp`; all tests passed; `tests.cpp` unchanged; lists what it did not verify. 16 seconds. |
| **Good prompt** | Corrects `median.cpp`; all tests passed. 6 seconds. | The same correction; all tests passed. 19 seconds. |

One run each, 13 November 2026, in the same folder. An 8-billion-parameter model on a laptop changed nothing with either prompt.

**Lesson:** as models get better, the prompt can get shorter. The context must stay clear: the specification, the tests, and the rules, in the folder.
    </textarea></section>
    <section class="course-extra-slide" data-markdown data-mascot-target="table" data-mascot-say="Run it again?"><textarea data-template>
## Models are probabilistic · Same prompt, different result

A compiler is deterministic: the same source file and options give the same program every time. A language model is probabilistic by nature: it computes a probability for each possible next token and samples one, so the same prompt can give a different result on every run.

| The same 7-word prompt, the same folder | Result |
| --- | --- |
| Small model, 5 runs | 2 corrected `median.cpp`; 3 answered "Let me fix it" and stopped, and the test still failed |
| Claude Fable 5.2, 3 runs | 3 corrected it and all tests passed; the code differed from run to run |

**Lesson:** one run tells you about one draft. You cannot make the model certain, so make the check certain: the compiler and your tests give the same answer every time.
    </textarea></section>
    <section data-markdown data-mascot-target="table" data-mascot-say="Write it down once."><textarea data-template>
## Context · Rules written once in a file

A command-line agent reads a project file such as `AGENTS.md` at the start of every session.

| A line in `AGENTS.md` | Why it is there |
| --- | --- |
| Compile with `g++ -std=c++17 -Wall`; no warnings. | The agent uses your compiler and your language standard. |
| Run the tests after every change; all must pass. | The agent can check its own work. |
| Do not edit `tests.cpp`. | An agent can make a failing test pass by changing the test. |
| Ask before you delete a file or install a package. | Some actions cannot be undone. |
| Say what you did not verify. | A report that hides a failure is worse than the failure. |

**When the agent makes the same error twice, add a line.**
    </textarea></section>

## AI in real projects · When nobody checks

    <section class="practical-example-slide course-code-22" data-markdown data-mascot-target="pre" data-mascot-say="A reply is input."><textarea data-template>
## Programs that call models · Check every reply

~~~cpp
class Assistant {                             // abstract class (Lecture 20)
public: virtual std::string reply(const std::string& prompt) = 0;
        virtual ~Assistant() = default;
};
class FakeAssistant : public Assistant {      // for tests: a fixed reply
public: explicit FakeAssistant(std::string r) : canned(r) {}
        std::string reply(const std::string&) override { return canned; }
private: std::string canned; };
// post-condition: returns "positive", "negative", or "unknown"
std::string classify(Assistant& ai, const std::string& feedback) {
    std::string r = ai.reply("Answer positive or negative: " + feedback);
    if (r == "positive" || r == "negative") return r;
    return "unknown";                         // never pass on an unchecked reply
}   // fake-good: positive · fake-chatty: unknown
~~~

**Takeaways:**

- A reply from a model is input, like `std::cin`: check it before use.
- The abstract class lets a `FakeAssistant` replace the real model in tests, with no network.

## What stays yours · Twenty lectures of it

| You learned | With an agent, you use it to |
| --- | --- |
| Pre-conditions and post-conditions (Lecture 12) | state the goal, so that nothing is left to guess |
| `assert` and tests | give the agent a check it can run |
| Pointers, arrays, and undefined behavior | see the error in code that seems to work |
| Classes and invariants | decide the design; the agent fills in the member functions |
| Abstract classes and late binding (Lecture 20) | replace a real model with a fake one in tests |
| Reading and tracing a program | review a diff: you can only review code you are able to read |

**An agent writes faster than you can. It does not know what you want until you say it, or whether the result is right until you check.**

    <section data-markdown data-mascot-target="table" data-mascot-say="Compiles is not correct."><textarea data-template>
## Common errors · Working with an agent

| Error | Example | Result |
|---|---|---|
| Vague goal | `write a median function` | the agent guesses the pre-condition |
| No check to run | no tests in the folder | the agent stops when the code compiles |
| Accept code because it compiles | the first `median` draft | wrong for an even count; no message |
| Allow every request without reading | an edit to `tests.cpp`; a deleted file | tests that no longer test; lost work |
| One very large task | "write the whole project" | a diff too long to review |
| A name that does not exist | a header or package the model invented | compile or link error; a wrong package can be installed |
| Share private data | passwords or keys in a prompt | the text leaves your computer |
    </textarea></section>

## Questions about AI agents

| Question | Answer |
|---|---|
| Will agents replace programmers? | Nobody knows how far this goes. In every project on today's slides, people set the goal, chose the tests, and checked the result. |
| Why learn C++ if an agent can write it? | You can only review code you are able to read, and only specify what you understand. |
| Why does it invent a function that does not exist? | It produces likely text; the compiler and the documentation decide what exists. |
| The agent's code passes my tests: is it correct? | It is correct for those inputs; add boundary cases and run a sanitizer. |
| May I use an agent in a lab or an exam? | Follow the rule stated for each lab, quiz, and exam; when it is allowed, say that you used it. |
| Who is responsible for the code? | You: the name on the submission is yours. |

    <section class="course-fill-text-sm" data-markdown data-mascot-target="li:first-child" data-mascot-say="Goal. Check. Review."><textarea data-template>
## Summary: programming with AI agents

- An agent is a model in a loop with tools: it reads, edits, runs, and repeats.
- Give it a **goal**, the **context**, and a **check** it can run.
- Work in small steps; read every request and every diff.
- A reply from a model is input: check it before use, in a prompt and in a program.
- The **specification**, the **tests**, and the **review** stay with you; so does the choice of what to build.

**Reading:** Stroustrup, *PPP* (2nd ed.), “Errors” and “Testing”; Savitch, “Functions for All Subtasks”, sections “Testing and Debugging Functions” and “General Debugging Techniques”.
    </textarea></section>

## Install and run an agent · A local model

~~~text
$ npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      # or:  curl -fsSL https://pi.dev/install.sh | sh
$ ollama pull qwen2.5-coder:3b          # a 1.9 GB model, from ollama.com
$ cat ~/.pi/agent/models.json           # tells pi where the model is
{ "providers": { "ollama": {
    "baseUrl": "http://localhost:11434/v1", "api": "openai-completions",
    "apiKey": "ollama", "models": [ { "id": "qwen2.5-coder:3b" } ] } } }
$ cd median-project
$ pi --model ollama/qwen2.5-coder:3b    # or once:  pi -p "prompt"
~~~

In our run, a 4-billion-parameter local model wrote the correct edit as text but did not apply it. Small models answer well in a chat; acting as an agent is harder.

## Lab practice: a 2 GB model on your laptop

1. Install Ollama from [ollama.com/download](https://ollama.com/download), then run `ollama pull qwen2.5-coder:3b` (1.9 GB).
1. Run `ollama run qwen2.5-coder:3b "write a median function"`. List what it guessed. In one run on 13 November 2026 it answered in Python.
1. Write a prompt with the signature, the pre-condition, and the post-condition. Paste the reply into `median.cpp` of the [demo project](codes/index.html#lecture-21) and run the tests. Improve the prompt until you see `all tests passed`.
