    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## A function owns one clear responsibility. · Travel estimate behind a function interface

The caller validates input, then a small function receives two values and returns one calculated result.

~~~cpp
#include <iostream>

double estimateTravel(double distanceKm, double speedKmph) {
    return distanceKm / speedKmph;
}

int main() {
    double distance = 420;
    double speed = 70;
    if (distance >= 0 && speed > 0)
        std::cout << "Travel time: " << estimateTravel(distance, speed) << " hours";
}
~~~

**Takeaways**

- A function owns one clear responsibility.
- Parameters receive the arguments passed by the caller.
- The return value is the calculated output.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="7" data-markdown><textarea data-template>
## The general form of a declaration, a definition, and a call

~~~cpp
<return type> <name>(<parameter type> <parameter>, ...);   // declaration (prototype)

<return type> <name>(<parameter type> <parameter>, ...) {  // definition: the body
    return <expression>;        // type must convert to <return type>
}

<name>(<argument>, ...)         // call: arguments are copied into the parameters

auto <name> = [](<parameter type> <parameter>) { return <expression>; };   // lambda
~~~

| Part | Meaning |
| --- | --- |
| `<return type>` | The type handed back to the caller. <code>void</code> returns nothing, so its <code>return;</code> carries no value. |
| `<name>(<parameters>)` | The signature. Name plus parameter list is what a caller has to match. |
| declaration vs definition | A declaration ends at the semicolon and may repeat; exactly one definition supplies the body. |
| `<argument>` | Copied into the parameter, so assigning to the parameter leaves the caller's variable unchanged. |

Put the declaration above <code>main</code> whenever the definition sits below it: the compiler must see the declaration before the first call.
    </textarea></section>
    <section data-markdown><textarea data-template>
## One function performs one explainable operation

A function's specification states:

- its parameters and their types;
- any preconditions the caller must satisfy;
- its return value or visible effect.

Small, clearly specified functions reduce duplication and can be tested independently.
    </textarea></section>

## Read a function’s declaration before its definition

~~~cpp
double rectangleArea(double length, double width) {
    return length * width;
}
~~~

Return type → name → parameters → body.

## Declare interfaces once and define each function once

~~~cpp
#include <iostream>

double rectangleArea(double length, double width);  // declaration

int main() {
    std::cout << rectangleArea(4.0, 3.0);
}

double rectangleArea(double length, double width) {
    return length * width;
}
~~~

## Value parameters isolate small inputs as local copies

~~~cpp
int doubled(int value) {
    value *= 2;
    return value;
}
~~~

Changing <code>value</code> does not change the caller's argument.

## Game evolution: A scoring function makes progress measurable

| Today's concept | Exact game part enabled |
|---|---|
| functions and value parameters | award points for cleaning without changing the caller accidentally |

~~~cpp
#include <iostream>
int scoreAfterClean(int score, bool dirtHere) {
    if (dirtHere) score += 10;
    return score;
}
int main() {
    int score=0;
    std::cout << scoreAfterClean(score,true) << ' ' << score << '\n';
}
~~~

**Test:** the function returns 10, while the caller's original <code>score</code> remains 0.

**Next unlock · L08:** deliberately mutate row and column through references.

    <section data-markdown><textarea data-template>
## Named functions turn a calculation into testable steps

~~~cpp
double subtotal(double price, int count) { return price * count; }
double tax(double amount, double rate) { return amount * rate; }
double total(double amount, double rate) { return amount + tax(amount, rate); }
~~~

Each name states one responsibility.
    </textarea></section>
    <section data-markdown><textarea data-template>
## A lambda packages short callable behavior where it is used

A lambda expression defines a small callable at its point of use.

~~~cpp
auto isPositive = [](int value) { return value > 0; };
~~~

Named functions remain the default for novice code. Lambdas return later as search and sorting applications.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Clear declarations and specifications make behavior testable

- A function's specification states its parameters, preconditions, and return value.
- A declaration makes a function known before its definition.
- Value parameters are copies.
- Prefer short functions with one explainable responsibility.
    </textarea></section>

## Verify Travel estimate behind a function interface with a claim, trace, boundary, and improvement

Use the practical example as a small experiment. Before you leave, make the reasoning visible:

- **Claim:** A function owns one clear responsibility.
- **Trace:** name the state that changes and the observation that would confirm it.
- **Boundary:** choose one smallest, largest, empty, or invalid input that could expose a defect.
- **Improvement:** explain one change that would make the solution clearer or safer.
