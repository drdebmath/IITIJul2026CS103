    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## The structure makes a complete data window available. · Find an anomalous temperature in a week

An array stores a fixed measurement window; one traversal computes the mean and locates the largest deviation.

~~~cpp
#include <array>
#include <cmath>
#include <iostream>

int main() {
    std::array<double, 7> t{31.2, 31.5, 37.8, 31.1, 30.9, 31.4, 31.0};
    double sum = 0;
    for (double value : t) sum += value;
    double mean = sum / t.size();

    std::size_t anomaly = 0;
    for (std::size_t i = 1; i < t.size(); ++i)
        if (std::abs(t[i] - mean) > std::abs(t[anomaly] - mean)) anomaly = i;

    std::cout << "Anomaly index: " << anomaly;
}
~~~

**Takeaways**

- The structure makes a complete data window available.
- Traversal applies one rule to every element.
- Searching is an application of array access.
    </textarea></section>
    <section data-markdown><textarea data-template>
## An array fixes its element type and extent

~~~cpp
#include <array>

std::array<double, 5> voltage{2.1, 2.3, 2.0, 2.4, 2.2};
~~~

The five elements occupy a contiguous sequence.
    </textarea></section>
    <section data-markdown><textarea data-template>
## An index is valid only inside the array’s exact bounds

~~~cpp
voltage[0] = 2.5;            // first element
double last = voltage[4];    // fifth element
~~~

For size 5, valid indices are 0 through 4.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Traversal uses the actual bound, never a guessed endpoint

~~~cpp
double sum = 0.0;
for (std::size_t i = 0; i < voltage.size(); ++i) {
    sum += voltage[i];
}
~~~

The invariant is: elements before <code>i</code> are already included.

## Range-for visits every element without manual indices

~~~cpp
double maximum = voltage[0];
for (double value : voltage) {
    if (value > maximum) maximum = value;
}
~~~

Use an explicit index only when the position matters.

## Array functions must receive the extent they rely on

~~~cpp
double mean(const std::array<double, 5>& values) {
    double sum = 0.0;
    for (double value : values) sum += value;
    return sum / values.size();
}
~~~

    <section data-markdown><textarea data-template>
## Out-of-bounds access has no reliable result

~~~cpp
// voltage[5] = 0.0;  // invalid: no sixth element
~~~

C++ does not automatically protect <code>operator[]</code>. Keep the valid range visible in the loop condition.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Safe array work respects index, traversal, and bound

- A fixed array has one type, one extent, and contiguous elements.
- Zero is the first index.
- Use <code>size()</code> as the traversal bound.
- State the invariant and test empty-boundary logic before coding.
    </textarea></section>
