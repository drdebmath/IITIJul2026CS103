    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Range and precision guide type choice. · Choose types for a sensor packet

A weather station mixes counts, precise measurements, status flags, and identifiers—each deserves an intentional type.

~~~cpp
#include <iostream>

int main() {
    int stationId = 2048;
    double temperature = 31.625;
    float humidity = 68.4f;
    bool batteryLow = false;
    char quality = 'A';

    std::cout << stationId << " " << temperature << " "
              << humidity << " " << quality << " " << batteryLow;
}
~~~

**Takeaways**

- Range and precision guide type choice.
- A type documents intent.
- Narrow types are useful only when their limits are understood.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Static typing checks a variable’s kind before the program runs

A **variable** is a named storage location. **Static typing** means types are checked before execution.

~~~cpp
int attempts = 0;
double temperature = 31.5;
char grade = 'A';
bool submitted = false;
~~~

The initializer supplies the first value.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Choose int, double, char, or bool from the value’s meaning

| Requirement | Suitable type | Example |
|---|---|---|
| whole-number count | <code>int</code> | students |
| fractional measurement | <code>double</code> | voltage |
| one character | <code>char</code> | grade |
| true/false state | <code>bool</code> | connected |

Sizes are implementation-dependent; inspect them with <code>sizeof</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Signedness and width determine the numeric range

<code>signed</code> supports negative and positive values. <code>unsigned</code> represents only non-negative values but wraps at its maximum.

<code>short</code>, <code>long</code>, and <code>long long</code> change minimum range requirements.

Use a modifier only when its range and interaction with other types are understood.
    </textarea></section>
    <section data-markdown><textarea data-template>
## const prevents accidental reassignment

~~~cpp
const double safeLimit = 12.5;
double reading = 11.8;

// safeLimit = 13.0;  // compile-time error
~~~

<code>const</code> prevents modification through that name after initialization.
    </textarea></section>
    <section class="course-extra-slide course-game-evolution-slide" data-markdown><textarea data-template>
## Game evolution: Named state gives the world memory

| Today's concept | Exact game part enabled |
|---|---|
| typed variables and constants | remember one actor's row, column, score, and board bounds |

~~~cpp
#include <iostream>
int main() {
    const int rows = 5, columns = 9;
    int headRow = 2, headColumn = 3;
    int score = 0;
    bool dirtHere = true;
    std::cout << headRow << ' ' << headColumn << ' ' << score << ' ' << dirtHere << '\n';
}
~~~

**Model check:** row and column are independent whole-number coordinates; dirt is a yes/no fact.

**Next unlock · L03:** compute a new coordinate from the current state and one movement delta.
    </textarea></section>
    <section data-markdown><textarea data-template>
## auto deduces one real type without removing type meaning

~~~cpp
auto samples = 12;       // int
auto mean = 7.25;        // double
const auto room = 103;   // const int
~~~

Use <code>auto</code> when the initializer makes the type obvious.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Explicit casts make possible information loss visible

~~~cpp
double mean = 97.56;
int whole = static_cast<int>(mean);  // 97
~~~

An explicit conversion documents intent. Check the destination range first: fractional information may be truncated, and an out-of-range conversion may be invalid.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Type choice follows meaning, range, and precision

- A type describes values and permitted operations.
- Choose representation from meaning, range, and precision.
- Do not assume exact byte sizes.
- Use <code>const</code> for values that must not change.
- Make potentially lossy conversions explicit.
    </textarea></section>
