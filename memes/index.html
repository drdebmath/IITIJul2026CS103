<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small CS103 visual archive.">
    <title>CS103 · Visual archive</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
        body { max-width: 1100px; margin: 0 auto; padding: 32px 20px 56px; }
        a { color: #2942ab; }
        header { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; margin-bottom: 28px; }
        h1 { margin: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
        figure { margin: 0; padding: 12px; border: 1px solid #dce3ee; border-radius: 16px; background: #fff; }
        img { display: block; width: 100%; height: 220px; object-fit: contain; background: #eef2f8; border-radius: 10px; }
        figcaption { margin-top: 10px; color: #627087; font-size: .9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Visual archive</h1>
        <a href="../index.html">Back to CS103</a>
    </header>
    <p>These images are retained as a small, intentionally linked course archive.</p>
    <main class="gallery" aria-label="Course visual archive">
        <figure><img src="arrayaccess.png" alt="Array access visual"><figcaption>Array access</figcaption></figure>
        <figure><img src="domino.png" alt="Domino visual"><figcaption>Domino</figcaption></figure>
        <figure><img src="functional_relief.png" alt="Functional relief visual"><figcaption>Functional relief</figcaption></figure>
        <figure><img src="magneticcore.png" alt="Magnetic core visual"><figcaption>Magnetic core</figcaption></figure>
        <figure><img src="outofbound.png" alt="Out-of-bounds visual"><figcaption>Out of bounds</figcaption></figure>
        <figure><img src="overflow.jpeg" alt="Overflow visual"><figcaption>Overflow</figcaption></figure>
        <figure><img src="uparrow.jpeg" alt="Up arrow visual"><figcaption>Up arrow</figcaption></figure>
    </main>
</body>
</html>
