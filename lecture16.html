# Lecture 16: Prove recursive progress to a base case
## Prove a smaller call reaches a base case

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## The base case handles an empty or one-node list. · Reverse a linked chain recursively

The recursive call solves the smaller tail; pointer rewiring makes the old head the new tail.

~~~cpp
struct Node { int value; Node* next; };

Node* reverse(Node* head) {
    if (!head || !head->next) return head;
    Node* newHead = reverse(head->next);
    head->next->next = head;
    head->next = nullptr;
    return newHead;
}
~~~

**Takeaways**

- The base case handles an empty or one-node list.
- The call stack remembers each old head.
- The algorithm is meaningful because of the linked structure.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="16" data-markdown><textarea data-template>
## The general form of a recursive function and a backtracking search

~~~cpp
<return type> <name>(<parameters>) {
    if (<base case condition>)
        return <base case result>;      // returns without calling <name> again

    return <combine>(<name>(<strictly smaller argument>));
}

void <solve>(<state>) {
    if (<state is complete>) { <record the solution>; return; }
    for (<each candidate choice>) {
        <apply the choice>;             // change the state
        <solve>(<state after the choice>);
        <undo the choice>;              // restore it for the next candidate
    }
}
~~~

| Part | Meaning |
| --- | --- |
| <code>&lt;base case condition&gt;</code> | The case answered outright. Without one, the recursion never stops. |
| <code>&lt;strictly smaller&gt;</code> | Every call must move measurably closer to the base case — smaller <code>n</code>, shorter list, fewer choices. |
| <code>&lt;combine&gt;</code> | What this call adds to the answer the smaller call returns. |
| <code>&lt;undo the choice&gt;</code> | Backtracking's defining step. Skip it and later branches search a state the earlier branch dirtied. |
| the stack | Each active call holds a frame until it returns, so depth costs memory as well as time. |

State the base case and the shrinking measure before writing the recursive call; those two facts are the termination proof.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Each recursive call adds a frame and must eventually return

For <code>factorial(3)</code>:

1. <code>factorial(3)</code> waits for <code>factorial(2)</code>.
2. <code>factorial(2)</code> waits for <code>factorial(1)</code>.
3. The base case returns 1.
4. Waiting frames finish in reverse order.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Every recursive call moves toward its base case

~~~cpp
int factorial(int n) {
    if (n <= 1) return 1;
    return n * factorial(n - 1);
}
~~~

The argument decreases, so a non-negative input reaches the base case.

## Recursive reversal rewires one node and delegates the suffix

~~~cpp
Node* reverse(Node* head) {
    if (head == nullptr || head->next == nullptr) return head;
    Node* newHead = reverse(head->next);
    head->next->next = head;
    head->next = nullptr;
    return newHead;
}
~~~

## Game evolution: Recursive search explores and undoes choices

| Today's concept | Exact game part enabled |
|---|---|
| recursion and backtracking | ask whether the Cleaner can reach dirt through open cells |

~~~cpp
#include <string>
#include <vector>
bool reaches(std::vector<std::string>& grid,int row,int column) {
    if (row<0 || column<0 || row>=static_cast<int>(grid.size()) ||
        column>=static_cast<int>(grid[0].size()) || grid[row][column]=='#') return false;
    if (grid[row][column]=='*') return true;
    grid[row][column]='#';
    return reaches(grid,row-1,column) || reaches(grid,row+1,column) ||
           reaches(grid,row,column-1) || reaches(grid,row,column+1);
}
~~~

**Progress argument:** every recursive branch either stops or marks one previously open cell.

**Next unlock · L17:** accelerate repeated collision checks and prioritize dirt.

## Memoization avoids repeated subproblems in LCS

For two strings, an LCS recurrence compares their final characters and reduces one or both prefixes.

The direct recursive version repeats subproblems. Memoization stores results so identical states are solved once.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Recursion trades stack space and repeated work for clarity

- Recursive list reversal: O(n) time, O(n) call-stack space.
- Iterative reversal: O(n) time, O(1) auxiliary space.
- Permutation generation: at least proportional to the number of produced permutations.

Complexity describes growth, not stopwatch seconds.
    </textarea></section>
