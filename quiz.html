## The paper asks three kinds of question

| Type | What you write |
| --- | --- |
| True or false | The verdict **and** one sentence saying why. A bare "False" earns nothing. |
| Predict the output | Exactly what the program prints, including spaces and line breaks. |
| Complete the code | The missing fragment, written so the program meets the stated goal. |

Every question below is a sample in that format, with the answer on the same slide. Cover the answer, commit to yours, then compare.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Type 1 · True or false, with one sentence of reason

The reason carries the marks. It must name the rule, not restate the verdict.

- Weak: "False, because it does not work that way."
- Strong: "False, because <code>do-while</code> tests its condition *after* the body, so the body always runs at least once."

One sentence is enough. Name the mechanism.
    </textarea></section>
    <section class="course-extra-slide course-quiz-slide" data-markdown><textarea data-template>
## Sample 1 · True or false

"A <code>do-while</code> loop can finish without ever executing its body."

<ol class="course-quiz-options">
<li><button class="course-quiz-option" type="button">True</button></li>
<li><button class="course-quiz-option" type="button" data-course-quiz-correct>False</button></li>
</ol>

<p class="course-quiz-explanation"><strong>False</strong> — the condition is tested after the body, so the body always runs at least once.</p>
    </textarea></section>
    <section class="course-extra-slide course-quiz-slide" data-markdown><textarea data-template>
## Sample 2 · True or false

"After <code>int x = 7 / 2;</code> the variable <code>x</code> holds <code>3</code>."

<ol class="course-quiz-options">
<li><button class="course-quiz-option" type="button" data-course-quiz-correct>True</button></li>
<li><button class="course-quiz-option" type="button">False</button></li>
</ol>

<p class="course-quiz-explanation"><strong>True</strong> — both operands are <code>int</code>, so integer division discards the fractional part rather than rounding.</p>
    </textarea></section>
    <section class="course-extra-slide course-quiz-slide" data-markdown><textarea data-template>
## Sample 3 · True or false

"In <code>if (a != 0 &amp;&amp; b(a))</code>, the function <code>b</code> is called every time the <code>if</code> is reached."

<ol class="course-quiz-options">
<li><button class="course-quiz-option" type="button">True</button></li>
<li><button class="course-quiz-option" type="button" data-course-quiz-correct>False</button></li>
</ol>

<p class="course-quiz-explanation"><strong>False</strong> — <code>&amp;&amp;</code> short-circuits, so when <code>a != 0</code> is false the right operand is never evaluated.</p>

    <section data-markdown><textarea data-template>
## Type 2 · Predict the output

Write what the program prints, exactly. Trace on paper: one column per variable, one row per iteration.

Marks are lost for missing spaces and missing line breaks, so write <code>_</code> for a space if your handwriting is ambiguous.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Sample 4 · What does this print?

~~~cpp
int count = 0;
for (int i = 1; i <= 4; ++i) {
    if (i % 2 == 0) continue;
    count += i;
}
std::cout << count;
~~~

**Answer:** <code>4</code>

<code>continue</code> skips the even values, so only <code>1</code> and <code>3</code> are added.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Sample 5 · What does this print?

~~~cpp
for (int r = 1; r <= 3; ++r) {
    for (int c = 1; c <= r; ++c) std::cout << '*';
    std::cout << '\n';
}
~~~

<pre data-course-static-output aria-label="Program output"><code>*
**
***</code></pre>

The inner bound is <code>r</code>, so row <code>r</code> prints exactly <code>r</code> stars.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Sample 6 · What does this print?

~~~cpp
int grade = 2;
switch (grade) {
    case 1: std::cout << "one ";
    case 2: std::cout << "two ";
    case 3: std::cout << "three "; break;
    default: std::cout << "other ";
}
~~~

**Answer:** <code>two three </code>

Execution enters at <code>case 2</code> and falls through into <code>case 3</code>, because only <code>case 3</code> has a <code>break</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Type 3 · Complete the missing code

The comment states the goal. Write the fragment that meets it — not a whole rewritten program.

Check three things before moving on: the loop still terminates, the boundary value is on the correct side of the comparison, and every declared name is spelled as declared.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Sample 7 · Fill the missing condition

~~~cpp
int value = 0, total = 0;
std::cin >> value;
while (__________) {   // stop at the sentinel -1, do not add it
    total += value;
    std::cin >> value;
}
std::cout << total;
~~~

**Missing code:** <code>value != -1</code>

For input <code>5 8 -1 4</code> this prints <code>13</code>: the sentinel ends the loop before it is added, and the <code>4</code> is never read.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Sample 8 · Fill the missing loop tail

~~~cpp
int age = 0;
do {
    std::cin >> age;
} __________          // keep asking until age is positive
std::cout << age;
~~~

**Missing code:** <code>while (age &lt;= 0);</code>

The semicolon is part of the answer. For input <code>-3 0 12</code> the program prints <code>12</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Sample 9 · Fill the missing update

~~~cpp
for (int n = 4; n >= 1; __________) {   // print 4 3 2 1
    std::cout << n << ' ';
}
~~~

**Missing code:** <code>--n</code>

The bound is <code>n &gt;= 1</code>, so the update must decrease <code>n</code>; <code>++n</code> here would never terminate.
    </textarea></section>

## What Quiz 1 covers

Lectures 1–6, including the supplement:

- **L01–L02** program structure, types, conversions, and constants.
- **L03 · L3.5** expressions, scope, lifetime, and <code>++i</code> versus <code>i++</code>.
- **L04** boolean conditions, <code>if</code>/<code>else if</code>/<code>else</code>, <code>switch</code>, and short-circuiting.
- **L05** <code>while</code>, <code>do-while</code>, sentinels, and termination.
- **L06** <code>for</code>, nested loops, invariants, and boundaries.

Every lecture has a syntax-template slide. If you cannot write the template from memory, start your revision there.

    <section data-markdown><textarea data-template>
## Q1 (a)–(d) · True or false

| Part | Verdict | Reason |
| --- | --- | --- |
| **(a)** file holding only <code>std::cout &lt;&lt; "Hi";</code> is a complete program | **False** | A statement must sit inside a function; with no <code>main</code> and no <code>#include &lt;iostream&gt;</code> there is nothing to run. |
| **(b)** <code>int x = 9 / 4;</code> gives <code>x == 2</code> | **True** | Both operands are <code>int</code>, so integer division truncates toward zero and drops the <code>.25</code>. |
| **(c)** after <code>const int limit = 10;</code>, <code>limit = 12;</code> is valid | **False** | <code>const</code> makes the object read-only for its whole lifetime; assigning to it is a compile error, whatever its type. |
| **(d)** <code>{ int steps = 3; } std::cout &lt;&lt; steps;</code> is valid | **False** | <code>steps</code> lives only inside its block, so after the closing brace the name is out of scope. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q1 (e)–(h) · True or false

| Part | Verdict | Reason |
| --- | --- | --- |
| **(e)** with <code>x = 8</code>, an <code>if</code>/<code>else if</code> chain can run both branches | **False** | The <code>else if</code> is reached only when the first condition is false, so a chain runs at most one branch. |
| **(f)** <code>switch (2.5)</code> can select <code>case 2:</code> | **False** | A switch condition must have integral or enumeration type; a <code>double</code> is rejected at compile time, not rounded. |
| **(g)** with <code>code == 1</code>, <code>case 1</code> without <code>break</code> runs only <code>case 1</code> | **False** | Without <code>break</code> control falls through into <code>case 2</code> and keeps going until a <code>break</code> or the closing brace. |
| **(h)** with <code>x = 0</code>, <code>x != 0 &amp;&amp; 12 / x &gt; 2</code> divides by zero | **False** | <code>&amp;&amp;</code> short-circuits: the left operand is false, so the division is never evaluated. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q1 (i)–(l) · True or false

| Part | Verdict | Reason |
| --- | --- | --- |
| **(i)** with <code>n = 0</code>, <code>while (n &gt; 0) { std::cout &lt;&lt; n; }</code> prints <code>0</code> once | **False** | <code>while</code> tests before the body, so with <code>0 &gt; 0</code> false the body never runs and nothing is printed. |
| **(j)** with <code>n = 0</code>, <code>do { std::cout &lt;&lt; n; } while (n &gt; 0);</code> prints <code>0</code> once | **True** | <code>do-while</code> tests after the body, so the body runs once, prints <code>0</code>, and the false condition then ends the loop. |
| **(k)** <code>while (x != -1) { total += x; std::cin &gt;&gt; x; }</code> adds the sentinel | **False** | The sentinel fails the condition before the body runs again, so <code>-1</code> is read but never added. |
| **(l)** <code>for (int i = 5; i &lt; 5; i += 1) std::cout &lt;&lt; i;</code> prints <code>5</code> once | **False** | The condition <code>5 &lt; 5</code> is false on the first test, so the loop body executes zero times. |
    </textarea></section>

## Q2 (a) · Predict the exact output

~~~cpp
int distance = 7, time = 2;
double speed = distance / time;
std::cout << speed << '\n';
~~~

<pre data-course-static-output aria-label="Program output"><code>3
</code></pre>

<code>distance / time</code> is <code>int</code> division and yields <code>3</code> *before* anything is stored; declaring <code>speed</code> as <code>double</code> converts the <code>3</code>, it does not recover the <code>.5</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q2 (b) · Predict the exact output

~~~cpp
int score = 7;
if (score > 7) std::cout << "A ";
else if (score >= 5) std::cout << "B ";
else std::cout << "C ";
std::cout << score % 4 << '\n';
~~~

<pre data-course-static-output aria-label="Program output"><code>B 3
</code></pre>

<code>7 &gt; 7</code> is false and <code>7 &gt;= 5</code> is true, so only the <code>"B "</code> branch runs; then <code>7 % 4</code> is <code>3</code>. The space after <code>B</code> is part of the answer.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q2 (c) · Predict the exact output

~~~cpp
int n = 3;
while (n > 0) {
    std::cout << n << ' ';
    n -= 1;
}
~~~

<pre data-course-static-output aria-label="Program output"><code>3 2 1 </code></pre>

Three iterations, each printing the value then a space. There is a trailing space after <code>1</code> and no newline anywhere.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q2 (d) · Predict the exact output

~~~cpp
int total = 0;
for (int i = 1; i <= 6; i += 1) {
    if (i % 2 == 0) continue;
    total += i;
}
std::cout << total << '\n';
~~~

<pre data-course-static-output aria-label="Program output"><code>9
</code></pre>

<code>continue</code> jumps to the update, so the even values add nothing: <code>1 + 3 + 5 == 9</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q2 (e) · Predict the exact output

~~~cpp
int code = 1;
switch (code) {
 case 0: std::cout << "zero "; break;
 case 1: std::cout << "one ";
 case 2: std::cout << "two "; break;
 default: std::cout << "other ";
}
~~~

<pre data-course-static-output aria-label="Program output"><code>one two </code></pre>

Control enters at <code>case 1</code>, and with no <code>break</code> there it falls through into <code>case 2</code>, whose <code>break</code> finally leaves the switch. <code>default</code> is never reached.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q2 (f) · Predict the exact output

~~~cpp
int total = 0;
for (int r = 1; r <= 3; r += 1) {
    for (int c = 1; c <= r; c += 1) {
        if (c == 2) continue;
        total += r + c;
    }
    std::cout << total << ' ';
}
std::cout << '\n';
~~~

<pre data-course-static-output aria-label="Program output"><code>2 5 15 
</code></pre>

<code>total</code> is declared outside, so it carries across rows: <code>r=1</code> adds <code>2</code>; <code>r=2</code> adds <code>3</code> and skips <code>c=2</code>; <code>r=3</code> adds <code>4</code> and <code>6</code>. The print is in the *outer* loop, once per row.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q2 (g) · Predict the exact output

~~~cpp
int x = 0;
if (x != 0 && 12 / x > 2)
    std::cout << "A ";
else
    std::cout << "B ";

switch (x + 1) {
    case 0: std::cout << "zero ";
    case 1: std::cout << "one ";
    case 2: std::cout << "two "; break;
    default: std::cout << "other ";
}
std::cout << '\n';
~~~

<pre data-course-static-output aria-label="Program output"><code>B one two 
</code></pre>

Short-circuiting makes the guard false without dividing, so the <code>else</code> runs. Then <code>switch (1)</code> enters at <code>case 1</code> and falls through into <code>case 2</code>, which breaks.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q3 (a) · Complete the missing code

Stop at the sentinel <code>0</code> and do not add it.

~~~cpp
int value = 0, total = 0;
std::cin >> value;
while (__________) {
    total += value;
    std::cin >> value;
}
std::cout << total;
~~~

**Missing code:** <code>value != 0</code>

The read before the loop and the read at the end of the body keep the test looking at a value that has already arrived, so the sentinel ends the loop before it is added.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q3 (b) · Complete the missing code

Keep asking until <code>choice</code> is from 1 through 4.

~~~cpp
int choice = 0;
do {
    std::cin >> choice;
} while (__________);
~~~

**Missing code:** <code>choice &lt; 1 || choice &gt; 4</code>

A <code>do-while</code> condition says *keep going*, so it must describe the **invalid** range — the negation of <code>choice &gt;= 1 &amp;&amp; choice &lt;= 4</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q3 (c) · Complete the missing code

Print <code>2 4 6 8 10</code>, with a space after each.

~~~cpp
for (int k = 2; k <= 10; __________) {
    std::cout << k << ' ';
}
~~~

**Missing code:** <code>k += 2</code>

The start is <code>2</code> and the bound is inclusive, so a step of <code>2</code> lands exactly on <code>10</code> and stops. <code>k++</code> would print the odd values too.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q3 (d) · Complete the missing code

Run the division only for a nonzero denominator.

~~~cpp
if (__________ &&
    numerator / denominator > 2) {
    std::cout << "large quotient";
}
~~~

**Missing code:** <code>denominator != 0</code>

The guard has to be the *left* operand: <code>&amp;&amp;</code> short-circuits left to right, so a false guard stops the division from ever being evaluated.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q3 (e) · Average the positive even values

Input ends with <code>-1</code>; print the integer average of the positive even values, or <code>none</code>.

~~~cpp
int x = 0, total = 0, count = 0;
std::cin >> x;
while (__________) {          // 1
    if (__________) {         // 2
        total += x;
        __________;           // 3
    }
    std::cin >> x;
}
if (count == 0) std::cout << "none\n";
else            std::cout << total / count << '\n';
~~~

**1** <code>x != -1</code> · **2** <code>x &gt; 0 &amp;&amp; x % 2 == 0</code> · **3** <code>count += 1</code>

The counter must be incremented inside the <code>if</code>, next to <code>total += x</code>: every value added to the sum has to be counted exactly once, or the average is wrong.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Q3 (f) · Does n have a divisor in 2 … n−1?

~~~cpp
int n = 0;
std::cin >> n;
bool hasDivisor = false;
for (int d = 2; __________; d += 1) {   // 1
    if (__________) {                   // 2
        __________;                     // 3
        break;
    }
}
std::cout << hasDivisor;
~~~

**1** <code>d &lt; n</code> · **2** <code>n % d == 0</code> · **3** <code>hasDivisor = true</code>

The bound is <code>d &lt; n</code>, not <code>d &lt;= n</code> — <code>n</code> always divides itself, so including it would report a divisor for every input. For <code>n</code> of <code>2</code> or less the loop runs zero times and the program correctly prints <code>0</code>.
    </textarea></section>
