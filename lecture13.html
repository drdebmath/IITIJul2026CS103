## A struct models one domain record. · Represent and filter sensor records

A struct keeps each reading coherent; passing by const reference lets a function inspect records efficiently.

~~~cpp
#include <iostream>
#include <string>

struct Reading {
    std::string sensor;
    double value;
    bool valid;
};

void printIfValid(const Reading& r) {
    if (r.valid) std::cout << r.sensor << ": " << r.value << std::endl;
}

int main() {
    Reading sample{"pressure-2", 101.7, true};
    printIfValid(sample);
}
~~~

**Takeaways**

- A struct models one domain record.
- Member names replace parallel loose variables.
- References avoid unnecessary record copies.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="13" data-markdown><textarea data-template>
## The general form of a struct, a record array, and a pointer

~~~cpp
struct <Name> {
    <T> <field>;
    <U> <field>;
};                                  // the semicolon is part of the declaration

<Name> <object>{ <value>, <value> };   // members initialized in declaration order
<object>.<field>                       // select through an object

<Name> <records>[<size>];            // many values of one shape, kept together

<T>* <p> = &<object>;      // <p> holds the address of <object>
*<p>                       // the object stored at that address
<p>-><field>               // shorthand for (*<p>).<field>
<p> = nullptr;             // holds no address; dereferencing it is undefined
~~~

| Part | Meaning |
| --- | --- |
| <code>struct</code> | Groups the fields of one record so they travel and stay consistent together. |
| trailing <code>;</code> | Omitting it is one of the most common compile errors in this lecture. |
| `&<object>` | Yields the address. A pointer stores where a value lives, not the value. |
| <code>.</code> vs <code>-&gt;</code> | <code>.</code> selects through an object, <code>-&gt;</code> through a pointer to one. |
| <code>nullptr</code> | The one address value you can safely test for. Check before you dereference. |

One array of records beats several parallel arrays: the fields of a record cannot drift out of step if they never live apart.
    </textarea></section>

## A pointer stores where an object lives

~~~cpp
int score = 95;
int* scorePointer = &score;
~~~

The pointer is a separate object. <code>&score</code> obtains the address of <code>score</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Dereference only a pointer proved valid

~~~cpp
if (scorePointer != nullptr) {
    *scorePointer += 5;
}
~~~

Dereferencing accesses the pointed-to object. <code>nullptr</code> explicitly means “no object.”

## Game evolution: Records keep cells and entities coherent

| Today's concept | Exact game part enabled |
|---|---|
| structs and pointers | keep a cell's coordinate and dirt together, then refer to one target |

~~~cpp
#include <array>
struct Cell { int row; int column; bool dirty; };
int main() {
    std::array<Cell,3> cells{{{0,0,false},{0,1,true},{0,2,false}}};
    Cell* target=nullptr;
    for (Cell& cell:cells) if (cell.dirty) target=&cell;
    if (target!=nullptr) target->dirty=false;
}
~~~

**Invariant:** <code>target</code> is either null or points to a live element of <code>cells</code>.

**Next unlock · L14:** make each Snake segment own the next segment dynamically.

## Layout, alignment, and pointer arithmetic affect safety

Compilers may insert padding so members satisfy alignment constraints. Use <code>sizeof</code> and <code>offsetof</code> to inspect a specific implementation.

Pointer arithmetic is valid only within one array object (or one-past its end). Prefer indexed or range-based traversal.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Safe memory reasoning groups state and validates addresses

- A struct creates one coherent record type.
- An array of records stores repeated entities.
- A pointer stores an address; dereferencing requires validity.
- Check for <code>nullptr</code> before access.
- Layout is implementation-specific and pointer arithmetic has strict bounds.
    </textarea></section>
