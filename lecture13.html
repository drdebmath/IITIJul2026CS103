    <section data-markdown><textarea data-template>
## Example: a struct · One record, several named data members

~~~cpp
#include <iostream>

struct Reading {
    int sensorId;
    double value;
    bool valid;
};

int main() {
    Reading sample{7, 31.5, true};
    std::cout << "sensor " << sample.sensorId << ": " << sample.value << '\n';
    sample.value = 32.0;                       // change one member
    std::cout << "now " << sample.value << '\n';
}
~~~

~~~text
sensor 7: 31.5
now 32
~~~

One <code>Reading</code> object holds three data members. The dot operator accesses a member by name.
    </textarea></section>

## An array of structs · Many records of one type, stored together

~~~cpp
#include <array>
#include <iostream>

struct Reading {
    int sensorId;
    double value;
    bool valid;
};

int main() {
    std::array<Reading, 3> samples{{
        {1, 30.1, true}, {2, 29.8, true}, {3, 0.0, false}
    }};
    for (const Reading& reading : samples) {
        if (reading.valid) std::cout << reading.sensorId << ": " << reading.value << '\n';
    }
}
~~~

## A pointer holds an address · The address-of operator &amp; gives an object's address

~~~cpp
#include <iostream>

int main() {
    int score = 95;
    int* scorePointer = &score;          // holds the address of score
    *scorePointer += 5;                  // dereference: reach score through the pointer
    std::cout << score << '\n';
    std::cout << (scorePointer == &score) << '\n';
    int* none = nullptr;                 // points to no object
    std::cout << (none == nullptr) << '\n';
}
~~~

~~~text
100
1
1
~~~

    <section class="course-extra-slide course-syntax-slide" data-course-syntax="13" data-markdown><textarea data-template>
## Structs and pointers: the general forms

~~~cpp
struct <TypeName> {                    // define a record type
    <type> <member>;                   // one member per line
    <type> <member>;
};

<TypeName> <object>{<value>, <value>}; // members initialized in order
<object>.<member>                      // access a member of an object

<type>* <pointer> = &<object>;         // pointer to an object of <type>
<type>* <pointer> = nullptr;           // pointer to no object
*<pointer>                             // dereference: the object pointed to
<pointer>-><member>                    // same as (*<pointer>).<member>
~~~

| Part | Meaning |
| --- | --- |
| `struct` | Defines a new type from members. The closing `;` is required. |
| `.` | Member access through an object (or a reference). |
| `&<object>` | Address-of: the address where the object lives. |
| `*<pointer>` | Dereference: access the pointed-to object. Valid only when the pointer holds the address of a live object. |
| `->` | Member access through a pointer. |
| `nullptr` | The null pointer: it points to no object. Never dereference it. |

A pointer that might be null must be checked before it is dereferenced.
    </textarea></section>

## Apollo 11, 20 July 1969 · Program alarms 1202 and 1201 during the descent

- During the descent the guidance computer raised program alarms 1202 and 1201: “executive overflow”.
- The computer had more jobs than it could finish in real time. A radar switch position made it process rendezvous radar data it did not need, “stealing” computer cycles.
- The software was built to cope: it dropped lower-priority jobs and restarted the important ones, so landing guidance kept running.
- Mission Control said “go”, and Eagle landed.

The software detected the overload and recovered instead of continuing blindly.
    </textarea></section>
    <section class="course-extra-slide course-story-slide" data-course-story="hamilton" data-markdown><textarea data-template>
## Check input before you use it · The P01 story

- Hamilton's daughter Lauren, playing in the flight simulator, keyed the prelaunch program P01 during a simulated flight. It wiped the navigation data.
- Hamilton asked for a check that would stop this. NASA declined to add it, so she added a program note: “Do not select P01 during flight.”
- On Apollo 8, in December 1968, Jim Lovell selected P01 in flight and erased the navigation data. Houston uploaded new navigation data.

**Lesson:** check input before you use it. For a pointer, that means checking for <code>nullptr</code> before you dereference it.
    </textarea></section>

## Check before you dereference · A pointer must point to an object

~~~cpp
int score = 95;
int* scorePointer = &score;
int* none = nullptr;

if (scorePointer != nullptr) {
    *scorePointer += 5;           // safe: it points to score
}

if (none != nullptr) {
    *none = 0;                    // skipped: no object to reach
} else {
    std::cout << "no object\n";
}
~~~

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Return a pointer when “not found” is an answer · Look up a sensor

~~~cpp
#include <array>
#include <iostream>

struct Reading {
    int sensorId;
    double value;
    bool valid;
};

// returns a pointer to the matching reading, or nullptr when there is none
const Reading* findSensor(const std::array<Reading, 3>& readings, int id) {
    for (const Reading& reading : readings) {
        if (reading.sensorId == id) return &reading;
    }
    return nullptr;
}

int main() {
    std::array<Reading, 3> samples{{
        {1, 30.1, true}, {2, 29.8, true}, {3, 0.0, false}
    }};
    for (int id : {2, 3, 9}) {
        const Reading* found = findSensor(samples, id);
        if (found == nullptr) {
            std::cout << "sensor " << id << ": not found\n";
        } else if (!found->valid) {
            std::cout << "sensor " << id << ": invalid reading\n";
        } else {
            std::cout << "sensor " << id << ": " << found->value << '\n';
        }
    }
}
~~~

| Sensor | Output |
|---|---|
| 2 | <code>sensor 2: 29.8</code> |
| 3 | <code>sensor 3: invalid reading</code> |
| 9 | <code>sensor 9: not found</code> |

**Takeaways**

- “Not found” is a normal outcome of a search, so the caller checks the result with <code>if</code>.
- The pointer points into <code>samples</code>, which outlives the call, so it stays valid.
- Check <code>nullptr</code> before <code>found-&gt;valid</code>: the <code>else if</code> is reached only when <code>found</code> is not null.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Passing a struct to a function · By value, by const reference, or by pointer

~~~cpp
void print(const Reading& reading) {            // read-only, no copy
    std::cout << reading.sensorId << ": " << reading.value << '\n';
}

void scale(Reading& reading, double factor) {   // may change the caller's object
    reading.value *= factor;
}

int main() {
    Reading a{7, 31.5, true};
    Reading b = a;                // copies every member
    scale(b, 2.0);
    print(a);
    print(b);
}
~~~

~~~text
7: 31.5
7: 63
~~~

- Assigning a struct copies every member, so <code>b</code> is independent of <code>a</code>.
- Pass by <code>const</code> reference to read and by reference to modify, as in Lecture 8.
- Use a pointer parameter only when “no object” is a legal argument: the function must then check for <code>nullptr</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## A pointer parameter has a pre-condition · The pointer must not be null

~~~cpp
#include <cassert>
#include <iostream>

struct Reading {
    int sensorId;
    double value;
    bool valid;
};

// pre-condition: reading != nullptr
void invalidate(Reading* reading) {
    assert(reading != nullptr);
    reading->valid = false;
}

int main() {
    Reading r{7, 31.5, true};
    invalidate(&r);
    std::cout << r.valid << std::endl;
    Reading* missing = nullptr;
    invalidate(missing);                // violates the pre-condition
}
~~~

~~~text
0
Assertion failed: (reading != nullptr), function invalidate, file reading.cpp, line 12.
~~~

The program aborts where the pre-condition is violated, instead of writing through a null pointer. The file name in the message is that of the compiled file. As in Lecture 12: <code>assert</code> for a caller's mistake, <code>if</code> for a situation the program expects.
    </textarea></section>

## Alignment and padding · A struct can be larger than the sum of its members

~~~cpp
#include <cstddef>
#include <iostream>

struct Reading {
    int sensorId;
    double value;
    bool valid;
};

int main() {
    std::cout << "sizeof(int) = " << sizeof(int) << '\n';
    std::cout << "sizeof(double) = " << sizeof(double) << '\n';
    std::cout << "sizeof(bool) = " << sizeof(bool) << '\n';
    std::cout << "sizeof(Reading) = " << sizeof(Reading) << '\n';
    std::cout << "offsetof sensorId = " << offsetof(Reading, sensorId) << '\n';
    std::cout << "offsetof value = " << offsetof(Reading, value) << '\n';
    std::cout << "offsetof valid = " << offsetof(Reading, valid) << '\n';
}
~~~

~~~text
sizeof(int) = 4
sizeof(double) = 8
sizeof(bool) = 1
sizeof(Reading) = 24
offsetof sensorId = 0
offsetof value = 8
offsetof valid = 16
~~~

## Pointer arithmetic · It moves by whole elements, inside one array

~~~cpp
#include <iostream>

int main() {
    int a[4]{10, 20, 30, 40};
    int* p = a;                       // the array name converts to &a[0]
    std::cout << *p << ' ' << *(p + 2) << ' ' << p[3] << '\n';
    ++p;                              // move to the next int
    std::cout << *p << '\n';
    int* end = a + 4;                 // one past the end: may be compared, never dereferenced
    std::cout << (end - p) << '\n';   // elements between p and end
    for (int* q = a; q != end; ++q) std::cout << *q << ' ';
    std::cout << '\n';
}
~~~

    <section data-markdown><textarea data-template>
## Common pointer errors

| Error | Example | Result |
|---|---|---|
| Null dereference | `int* p = nullptr; *p = 1;` | undefined behavior |
| Uninitialized pointer | `int* r; *r = 1;` | undefined behavior: it holds no valid address |
| Dangling pointer | `int* bad() { int local = 1; return &local; }` | undefined behavior once used: `local` is gone when `bad` returns |
| Out-of-range arithmetic | `a + 5` for `int a[4]` | undefined behavior, even before dereferencing |
| Address vs value | `p == q` compares addresses; `*p == *q` compares values | a logic error |
| `int* a, b;` | only `a` is a pointer; `b` is an `int` | a logic error: write one declaration per line |

The compiler often warns about the dangling case: <code>address of stack memory associated with local variable 'local' returned</code> (clang; g++ words it differently). Compile with <code>-Wall</code> and read the warnings.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Questions about structs and pointers (1)

| Question | Answer |
|---|---|
| Why does `&` appear in `int& r` and in `&score`? | In a declaration, `int&` means a reference. In an expression, `&score` is the address-of operator. Likewise `*` declares a pointer in `int* p` and dereferences in `*p`. |
| Reference or pointer? | A reference is an alias that always refers to an object. A pointer can be null and can be reassigned to point elsewhere. Prefer a reference unless "no object" is a valid argument. |
| Is `nullptr` the same as `0` or `NULL`? | `nullptr` is the null pointer literal, of its own type, `std::nullptr_t`, so it cannot be mistaken for an integer. Use it. |
| What does `std::cout << p` print? | An address, in an implementation-specific form such as `0x16f2b3c9c`. It changes between runs, so never depend on it. |
| Does `int* a, b;` declare two pointers? | No. `a` is an `int*` and `b` is an `int`. Write one declaration per line. |
| Does dereferencing `nullptr` always crash? | No. It is undefined behavior. Desktop systems usually stop the program, but the language promises nothing. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Questions about structs and pointers (2)

| Question | Answer |
|---|---|
| Can I compare two structs with `==`? | Not in C++17: `a == b` does not compile for a struct. Compare the members, or write a function. |
| Why is `sizeof(Reading)` 24, not 13? | Padding for alignment. The exact value depends on the implementation. |
| Does `assert(p != nullptr)` catch a dangling pointer? | No. A dangling pointer is not null, so the assert passes. It catches only the null case. |
| Can I print a struct with `cout << sample`? | Not unless you write the `operator<<` for it. Print the members. |
| What does `p + 1` do for a pointer to a struct? | It advances by `sizeof` of the struct, to the next element of the array. |
| Does `sample.value` work if `sample` is a pointer? | No: a pointer has no members. Use `p->value` or `(*p).value`. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Summary: structures and pointers

- A struct creates one coherent record type; its members are selected with <code>.</code>.
- An array of structs stores many records of one type.
- A pointer stores an address; <code>&amp;</code> takes one and <code>*</code> dereferences it.
- Check for <code>nullptr</code> before access: <code>if</code> for expected absence, <code>assert</code> for a pre-condition.
- Use <code>-&gt;</code> through a pointer, <code>.</code> through an object.
- Layout is implementation-specific, and pointer arithmetic has strict bounds.

**Reading:** Stroustrup, *Programming: Principles and Practice Using C++*, chapters “Vectors and Free Store” (pointers) and “Technicalities: Classes, etc.” (structs); Savitch, *Problem Solving with C++*, “Structures” (in “Defining Classes”) and “Pointers and Dynamic Arrays”.
    </textarea></section>

**IC151 lab practice · 5 problems**

1. **Struct basics.** Define `struct Student { int roll; double marks; };`. Read three students into a `std::array<Student, 3>` and print the roll number of the one with the highest marks.
1. **Find or nullptr.** Write `const Student* findRoll(const std::array<Student, 3>& s, int roll)` that returns `nullptr` when the roll is absent. Print `not found` when it is.
