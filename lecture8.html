# Lecture 8: Choose copy, alias, and recursion deliberately
## References, overloading, decomposition, and the call stack

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Parameter roles are visible at the interface. · Return two results without global state

Input values are copied; output references name the caller’s existing variables. The contract makes both roles explicit.

~~~cpp
#include <iostream>

void orderPair(int first, int second, int& smaller, int& larger) {
    if (first <= second) {
        smaller = first;
        larger = second;
    } else {
        smaller = second;
        larger = first;
    }
}

int main() {
    int low = 0, high = 0;
    orderPair(17, 4, low, high);
    std::cout << low << " " << high << '\n';
}
~~~

**Takeaways**

- Parameter roles are visible at the interface.
- References avoid hidden global state.
- One function performs one testable job.
    </textarea></section>
    <section data-markdown><textarea data-template>
## The parameter contract decides copy, alias, or read-only access

~~~cpp
void clampToZero(double& value) {
    if (value < 0.0) value = 0.0;
}
~~~

A reference is another name for the caller's object. Mutation must be part of the contract.
    </textarea></section>
    <section data-markdown><textarea data-template>
## const reference reads without copying or mutating

~~~cpp
void printReading(const double& reading) {
    std::cout << reading << '\n';
}
~~~

The syntax matters now; avoiding expensive copies becomes useful when records and strings arrive.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Overloads share a name only when parameter lists distinguish them

~~~cpp
int absolute(int value);
double absolute(double value);
~~~

The compiler selects from parameter lists. Return type alone cannot distinguish overloads.
    </textarea></section>

## Game evolution: A movement function isolates one rule

| Today's concept | Exact game part enabled |
|---|---|
| reference parameters and decomposition | update the caller's two coordinate variables in one named operation |

~~~cpp
void movePlayer(int& row, int& column, int dRow, int dColumn) {
    row += dRow;
    column += dColumn;
}
int main() {
    int row=2, column=3;
    movePlayer(row,column,0,1);
}
~~~

**Mutation contract:** only <code>row</code> and <code>column</code> are aliases; the direction values are copies.

**Next unlock · L09:** store the complete Snake body as sequences of coordinates.

## Decomposition keeps main readable and each step testable

~~~cpp
double readPositive();

~~~

<code>main</code> coordinates these tasks instead of containing every detail.

    <section data-markdown><textarea data-template>
## Each active call owns a stack frame until it returns

Each active call has a stack frame containing parameters, locals, and return state.

The most recent unfinished call completes first—last in, first out.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Recursion needs a base case and a smaller next call

~~~cpp
int factorial(int n) {
    if (n <= 1) return 1;          // base case
    return n * factorial(n - 1);   // smaller input
}
~~~

Every recursive call must move measurably toward a base case.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Choose parameter passing and decomposition from the contract

- References can expose caller state intentionally.
- <code>const&</code> provides read-only access through an alias.
- Overloads need distinguishable parameter lists.
- The call stack tracks unfinished calls.
- Recursive design requires a base case and progress.
    </textarea></section>
