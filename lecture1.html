# Lecture 1: Turn a precise problem into a running C++ program
## Input, process, output, and a first compiled run

Bring one problem you can explain in plain language; we will turn it into a small, observable program.

**Instructor:** [Dr. Debasish Pattanayak](https://drdebmath.github.io)
    </textarea></section>
    <section class="course-extra-slide course-intro-slide" data-markdown><textarea data-template>
## Programming lets you hand precise thinking to a machine

- A computer is fast and tireless, but it does exactly what it is told — nothing more.
- Programming is writing instructions precise enough for a machine to carry them out.
- One person who can program can automate calculations, control robots, test scientific models, and build tools used by millions.
- In every branch of engineering and science, the people who can program get to ask bigger questions.

By the end of today you will have written, compiled, and run a program of your own. The language is the tool; the skill is turning a problem into precise instructions.
    </textarea></section>
    <section class="course-extra-slide course-intro-slide" data-markdown><textarea data-template>
## High-level languages hide the machine; low-level languages expose it

| Level | You write | Example | Translated by |
|---|---|---|---|
| Machine code | binary instructions | `10110000 01100001` | nothing — the CPU runs it directly |
| Assembly | named instructions | `mov al, 97` | an assembler |
| High-level (C++, Python) | intent: names and formulas | `price = base + tax;` | a compiler or interpreter |

- **Low-level:** total control and detail, but tied to one processor family.
- **High-level:** readable, portable, and safer — the translator handles the machine's choreography.
- C++ sits deliberately in between: high-level abstraction, with low-level control when a problem needs it.
    </textarea></section>
    <section class="course-extra-slide course-intro-slide" data-markdown><textarea data-template>
## Each generation of languages moves work from you to the compiler

- **1940s · machine code:** programs entered as raw numbers; one wrong bit meant checking them all.
- **1950s · assembly and Fortran:** names replaced numbers; Fortran (1957) let scientists write formulas instead of instructions.
- **1970s · C:** one portable language for systems that had needed a rewrite on every machine.
- **1980s–90s · C++, Python, Java:** objects, rich libraries, and automatic memory management for much larger programs.
- **2010s · Rust, Swift, Go:** compilers that prove safety properties before the program ever runs.

Each era automates the previous era's manual discipline — which is why the *ideas* you learn here outlast any single language.
    </textarea></section>

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Travel-time estimator

A familiar question — "how long will the trip take?" — becomes the input → process → output pattern used by every program.

~~~cpp
#include <iostream>

int main() {
    double distanceKm, speedKmph;
    std::cin >> distanceKm >> speedKmph;

    double travelHours = distanceKm / speedKmph;
    std::cout << "Estimated hours: " << travelHours << "\n";
    return 0;
}
~~~

**Takeaways**

- Inputs become named values.
- The formula in the middle is the whole process.
- Output makes the program's result observable.
    </textarea></section>
    <section data-markdown><textarea data-template>
## A program is a precise set of instructions a computer can execute

A program leaves nothing to guess: every step is stated, in order, in a form the machine can carry out. The plan behind those steps is an **algorithm**; the program is that plan written so a computer can run it.

Use the same problem-solving workflow every time you build one:

1. **Problem:** state inputs, outputs, constraints, and success.
2. **Model:** keep only the details that affect the answer.
3. **Represent:** choose state and data structures.
4. **Solve:** write precise steps; implement one at a time.
5. **Verify:** explain why they work; test boundaries.
6. **Improve:** compare clarity, safety, generality, and cost.
    </textarea></section>

## The CPU executes instructions while RAM holds active state

- The **CPU** executes machine instructions.
- RAM holds active instructions and values temporarily.
- Storage keeps files when power is off.
- Binary encodes information using bits.

**Abstraction** lets C++ express ideas without writing machine instructions directly.

    <section data-markdown><textarea data-template>
## The toolchain turns source code into a testable executable

Save the source as <code>hello.cpp</code>, then use the toolchain:

~~~text
g++ -std=c++17 hello.cpp -o hello
./hello
~~~

- A compiler checks and translates the source.
- A linker combines required compiled parts.
- The executable is the program you run.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Choose a language from the problem’s trade-offs

A **programming language** makes some kinds of thinking and engineering easier than others.

- **C++17 is our main workshop:** high-level libraries, visible representation, resource control, and performance for games, graphics, science, and systems.
- **Rust is our modern glimpse:** ownership is checked by the compiler, preventing many memory and data-race defects before execution.
- Python favors rapid exploration; JavaScript reaches the browser; other languages serve other constraints.

There is no universally best language. We learn transferable models and algorithms, then choose tools from the problem.
    </textarea></section>

An identifier names something. A declaration introduces a name and its type.

    <section data-markdown><textarea data-template>
## Edit → compile → link → run → test is a reliable workflow

- Every program begins with input, process, and output.
- A program must be finite and precise about every step.
- The CPU executes the compiled instructions.
- <code>main</code> is the C++ entry point.
- Edit → compile → link → run → test.
    </textarea></section>

## Verify the travel-time estimator

Treat the example as a small experiment. Before you leave, make the reasoning visible:

- **Claim:** with inputs `120 60`, the program prints exactly `Estimated hours: 2`.
- **Trace:** write each variable and its value after every line to confirm the claim.
- **Boundary:** what happens when the speed is `0`? Run it and explain the result.
- **Improvement:** one change that would make the program clearer or safer.

### Exit ticket

- Read the length and width of a classroom and print area and perimeter.
- Read three quiz scores and print their arithmetic mean.

| Build | State and structure | Algorithmic idea |

| cleaning robot | grid + position + dirt | simulation and sweep |

    <section class="course-extra-slide course-showcase-slide" data-markdown><textarea data-template>
## One verified model can drive every view

~~~text
Problem → model/state → algorithm → trace
                            ├─ ASCII terminal animation
                            ├─ HTML/SVG interactive view
                            └─ modern C++ graphics window
~~~

- The **model** is the source of truth; a renderer is only a view.
- A recorded trace lets every view replay the same run.
- Extensions can add color, sound, controls, multiple agents, or procedural music without changing a verified core.

By semester end, you should be able to explain not only *what* you built, but *why its representation and algorithm fit the problem*.
    </textarea></section>
