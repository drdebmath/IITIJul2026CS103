## Where Lecture 16 ended · A rule every step must keep

A recursive function is correct when every call keeps a rule, and its **pre-condition** is what the caller must guarantee (Lecture 16).

A `struct` groups **data members**, and any code may change any of them (Lecture 13).

**Today's question.** How can a type keep a rule about its own data true, whatever the rest of the program does?
    </textarea></section>

    <section class="course-big-code course-code-36" data-markdown data-mascot-target="pre" data-mascot-say="true, then false!"><textarea data-template>
## Binary search in code · It assumes the values are sorted

~~~cpp
std::vector<int> first{35, 40, 52, 58, 70};
std::vector<int> second{35, 52, 58, 70, 40};
bool a = std::binary_search(first.begin(), first.end(), 40);
bool b = std::binary_search(second.begin(), second.end(), 40);
std::cout << std::boolalpha << a << '\n' << b << '\n';   // true, then false
~~~

`std::binary_search` looks at the middle element and discards the half that cannot hold the target. That is correct only for sorted values: sortedness is a **pre-condition**, and the function does not check it.
    </textarea></section>

    <section class="course-big-code course-code-32" data-markdown data-mascot-target="pre" data-mascot-say="One push_back broke it."><textarea data-template>
## A struct cannot protect its rule · Any code may change it

~~~cpp
struct Scores {
    std::vector<int> values;   // rule: ascending order
};
bool contains(const Scores& s, int x) {
    return std::binary_search(s.values.begin(), s.values.end(), x);
}
int main() {
    Scores s{{35, 52, 58, 70}};
    std::cout << std::boolalpha << contains(s, 58) << '\n';   // true
    s.values.push_back(40);                                    // breaks the rule
    std::cout << contains(s, 40) << '\n';                      // false
}
~~~


    </textarea></section>

## A class keeps its rule · Private data, public operations

~~~cpp
class SortedScores {
public:
    SortedScores(const std::vector<int>& v) : values(v) { std::sort(values.begin(), values.end()); }
    void add(int x) { values.insert(std::lower_bound(values.begin(), values.end(), x), x); }
    bool contains(int x) const { return std::binary_search(values.begin(), values.end(), x); }
    void print() const { for (int v : values) std::cout << v << ' '; std::cout << '\n'; }
private:
    std::vector<int> values;   // invariant: sorted, established by the constructor
};
// s({70, 35, 58, 52}); s.print(); s.add(40); s.print();  → 35 52 58 70, then 35 40 52 58 70

    <section class="course-extra-slide course-syntax-slide" data-course-syntax="17" data-markdown data-mascot-target="table" data-mascot-say="Don't forget the semicolon!"><textarea data-template>
## Class definition: the general form

| Part | Meaning |
| --- | --- |
| `class Name { ... };` | A user-defined type; a semicolon ends it. |
| `public:` | The **interface**: any code may use these members. |
| `private:` | The **representation**: only member functions may use it. |
| `Name(params) : m(v) { }` | A **constructor** with a **member initializer list**. |
| `Type f() const;` | A member function that does not change the object. |
| `Type Name::f() { }` | A member function defined outside the class. |
    </textarea></section>

## Constructors · Every object starts valid

~~~cpp
class SortedScores {
public:
    SortedScores() { std::cout << "default constructor\n"; }
    SortedScores(const std::vector<int>& v) : values(v) {
        std::sort(values.begin(), values.end()); std::cout << "vector constructor\n";
    }
    SortedScores(int count, int score) : values(count, score) { std::cout << "count constructor\n"; }
    int size() const { return static_cast<int>(values.size()); }
private: std::vector<int> values;   // invariant: sorted
};
// SortedScores a; SortedScores b({70, 35, 58}); SortedScores c(3, 50);  → default, vector, count

## const member functions · Reading without changing

~~~cpp
void report(const SortedScores& s) {
    std::cout << s.contains(58) << '\n';   // allowed: contains is const
    s.add(99);                             // line 14: add may change s
}
~~~

~~~text
const-error.cpp:14:5: error: 'this' argument to member function 'add'
has type 'const SortedScores', but function is not marked const
~~~

Through a `const` reference only `const` member functions may be called. Mark every member function that does not change the object `const`.

## Summary: classes and constructors

- A **class** bundles data members with member functions; its **class invariant** is a rule they all keep.
- `private` members can be named only by member functions; the compiler checks it.
- A **constructor** has no return type and establishes the invariant.
- Mark readers `const`. Common errors: no `;` after the class, `T a();`, a missing `Name::`.

**Reading:** Stroustrup, *PPP* (2nd ed.), “Technicalities: Classes, etc.”; Savitch, “Defining Classes”.
