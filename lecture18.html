## Where Lecture 17 ended · The constructor establishes the invariant

A **constructor** makes an object valid (Lecture 17). Every `new` needs one owner and one release (Lecture 14).

But objects are also copied, assigned, and destroyed.

**Today's question.** Who keeps the invariant then, and who releases what the object owns?
    </textarea></section>
    <section class="course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="c goes first!"><textarea data-template>
## Destructors · Last constructed, first destroyed

~~~cpp
class Tag {
public:
    Tag(std::string n) : name(n) { std::cout << "construct " << name << '\n'; }
    ~Tag() { std::cout << "destroy " << name << '\n'; }
private: std::string name;
};
int main() {
    Tag a("a");
    { Tag b("b"); Tag c("c"); std::cout << "end of block\n"; }
    std::cout << "end of main\n";
}
// construct a, construct b, construct c, end of block,
// destroy c, destroy b, end of main, destroy a
~~~

    <section class="course-extra-slide course-syntax-slide" data-course-syntax="18" data-markdown data-mascot-target="table" data-mascot-say="Three special members."><textarea data-template>
## Destructor and copy operations: the general form

| Part | Meaning |
| --- | --- |
| `~Name() { ... }` | The **destructor**: no return type, no parameters, one per class. It runs when the object's lifetime ends. |
| `Name(const Name& other)` | The **copy constructor**: creates a new object from an existing one. |
| `Name& operator=(const Name& other)` | **Copy assignment**, an overloaded operator: replaces the value of an object that already exists. |
| `this` | A pointer to the object the member function was called on; `this == &other` detects `a = a`. |
| `return *this;` | Copy assignment returns the object itself, so `a = b = c` works. |
| Not written? | The compiler generates all three; they copy or destroy each data member in turn. |
    </textarea></section>

## The default copy · Two owners, one array

~~~cpp
class IntArray {
public: IntArray(int n) : data(new int[n]{}) {}
    ~IntArray() { std::cout << "delete[] " << data << std::endl; delete[] data; }
    void set(int i, int v) { data[i] = v; }
    int get(int i) const { return data[i]; }
private: int* data;   // invariant: this object alone owns the array
};
int main() {
    IntArray a(3);  IntArray b = a;   // default copy: b.data == a.data
    b.set(0, 99);  std::cout << a.get(0) << '\n';   // a changed too
}   // prints 99, then "delete[] 0x1028b1b20" twice; the program aborts
~~~
    </textarea></section>

    <section class="course-extra-slide course-story-slide course-fill-text" data-course-story="zlib" data-markdown data-mascot-target="p strong" data-mascot-say="One owner, one release."><textarea data-template>
## A double free in zlib · One block of memory, released twice

- zlib 1.1.3, a C compression library in many programs, could free the same memory twice on some invalid input.
- CERT/CC advisory CA-2002-07 (12 March 2002): "denial of service, information leakage, or execution of arbitrary code".
- zlib 1.1.4 fixed it; every program linked to the old version needed the fix.

**Lesson:** give each resource one owner, whose destructor releases it once.
    </textarea></section>
    <section class="course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="Each object gets its own array."><textarea data-template>
## Copy constructor and copy assignment · Each object owns its own array

~~~cpp
IntArray(const IntArray& other) : size(other.size), data(new int[other.size]) {
    std::copy(other.data, other.data + size, data);       // copy constructor
}
IntArray& operator=(const IntArray& other) {      // copy assignment
    if (this == &other) return *this;             // a = a: nothing to do
    int* fresh = new int[other.size];
    std::copy(other.data, other.data + other.size, fresh);
    delete[] data;  data = fresh;  size = other.size;   // release old array
    return *this;
}
// IntArray a(3); IntArray b = a; IntArray c(5); c = a; b.set(0, 99);  → 0 99 0
~~~
    </textarea></section>

## Let members own the memory · Rule of Zero

~~~cpp
class Gradebook {
public: Gradebook(const std::string& c, int n) : course(c), marks(n, 0) {}
    void set(int i, int m) { marks.at(i) = m; }
    int get(int i) const { return marks.at(i); }
private: std::string course;  std::vector<int> marks;   // vector owns memory
};
// Gradebook a("CS103", 3); Gradebook b = a; b.set(0, 99);  → a: 0, b: 99
~~~

**Takeaways:** members that copy and release themselves need none of the three (**Rule of Zero**). Write one, write all three (**Rule of Three**).

## Common errors · One owner, one release

| Error | Example | Result |
|---|---|---|
| No destructor | `new int[n]`, no `~IntArray()` | memory leak |
| Destructor, default copy | `IntArray b = a;` | double deletion: undefined behavior |
| Assignment keeps the old array | no `delete[] data;` | memory leak |
| Copy parameter by value | `IntArray(IntArray other)` | compile error |
    </textarea></section>

## Questions about destructors and copying

| Question | Answer |
|---|---|
| When does a destructor run? | At the end of the scope; at `delete` for a free-store object. |
| Does pass-by-value copy? | Yes, with the copy constructor. Pass by `const&` (Lecture 8). |
| A `unique_ptr` data member? | It cannot be copied (Lecture 14), so copying the class is a compile error. |
| What does RAII stand for? | "Resource acquisition is initialization": lifetime controls the resource. |
    </textarea></section>
    <section class="course-fill-text-sm" data-markdown data-mascot-target="li:first-child" data-mascot-say="Construct, copy, destroy."><textarea data-template>
## Summary: destructors, copying, and RAII

- A **destructor** runs when the lifetime ends: last constructed, first destroyed.
- **RAII:** the constructor acquires, the destructor releases.
- The **copy constructor** creates; **copy assignment** replaces. The default copies a pointer: two owners.
- **Rule of Zero:** let `vector` and `string` members manage memory.

**Reading:** Stroustrup, *PPP* (2nd ed.), “Vector and Free Store” and “Vectors and Arrays”; Savitch, “Friends, Overloaded Operators, and Arrays in Classes”.
    </textarea></section>
