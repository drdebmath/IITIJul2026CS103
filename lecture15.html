## Choose operations before representation

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## The structure supplies the ordering guarantee. · Dispatch print jobs with a queue

FIFO order is a property of the queue structure; the scheduling algorithm simply consumes that interface.

~~~cpp
#include <iostream>
#include <queue>
#include <string>

int main() {
    std::queue<std::string> jobs;
    jobs.push("report.pdf");
    jobs.push("diagram.png");
    jobs.push("notes.txt");

    while (!jobs.empty()) {
        std::cout << "Printing " << jobs.front() << std::endl;
        jobs.pop();
    }
}
~~~

**Takeaways**

- The structure supplies the ordering guarantee.
- The algorithm uses only front, push, and pop.
- Choosing a structure simplifies the application.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="15" data-markdown><textarea data-template>
## The general form of a stack, a queue, and a linear search

~~~cpp
#include <stack>
#include <queue>

std::stack<T> <s>;
<s>.push(<value>);   <s>.top();     <s>.pop();   <s>.empty();   <s>.size();

std::queue<T> <q>;
<q>.push(<value>);   <q>.front();   <q>.pop();   <q>.empty();   <q>.size();

int <search>(const <T> <a>[], int <n>, const <T>& <target>) {
    for (int <i> = 0; <i> < <n>; ++<i>)
        if (<a>[<i>] == <target>) return <i>;
    return -1;                      // one agreed value meaning "absent"
}
~~~

| Part | Meaning |
| --- | --- |
| <code>push</code> | Adds one element. Both containers grow at the end they own. |
| <code>top</code> vs <code>front</code> | A stack exposes the most recent element, a queue the earliest. That difference is the whole abstraction. |
| <code>pop</code> | Removes, and returns nothing. Read the element first, then pop it. |
| <code>empty()</code> | Calling <code>top</code>, <code>front</code>, or <code>pop</code> on an empty container is undefined — test first. |
| linear search | Needs no ordering, examines at most `<n>` elements, and is the baseline every faster search must beat. |

Choose the structure from the ordering guarantee the problem needs, then let that choice decide which operations are cheap.
    </textarea></section>
    <section data-markdown><textarea data-template>
## An abstract data type specifies operations before representation

A stack promises <code>push</code>, <code>pop</code>, and <code>top</code>. A queue promises <code>enqueue</code>, <code>dequeue</code>, and <code>front</code>.

The contract does not require a class or one specific representation.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Linear search is the trustworthy baseline when only traversal is known

~~~cpp
std::vector<int> values{8, 3, 5, 3};
int target = 5;
std::size_t found = values.size();
for (std::size_t i = 0; i < values.size() && found == values.size(); ++i)
    if (values[i] == target) found = i;
~~~

Worst case: inspect every element.

    <section data-markdown><textarea data-template>
## Bubble sort trades simplicity for quadratic time

~~~cpp
for (std::size_t end = values.size(); end > 1; --end) {
    for (std::size_t i = 1; i < end; ++i) {
        if (values[i] < values[i - 1]) {
            int temporary = values[i];
            values[i] = values[i - 1];
            values[i - 1] = temporary;
        }
    }
}
~~~
    </textarea></section>
    <section data-markdown><textarea data-template>
## A stack returns the most recently pushed item first

With an array representation, keep one integer <code>top</code>:

- push: check capacity, then advance and store;
- pop: check emptiness, read, then retreat;
- top: inspect without removing.

An undo history and function calls are stack applications.

## A queue returns the earliest enqueued item first

A circular array keeps <code>front</code>, <code>rear</code>, and <code>count</code>. A linked queue keeps pointers to the first and last nodes.

Print jobs and breadth-first exploration are queue applications.

## Game evolution: A queue orders cleaning work

| Today's concept | Exact game part enabled |
|---|---|
| queue behavior on a linear structure | clean dirty cell IDs in first-discovered, first-served order |

~~~cpp
#include <iostream>
#include <vector>
int main() {
    std::vector<int> pending{8,13,21};
    std::size_t front=0;
    while (front<pending.size()) {
        int targetCell=pending[front];
        ++front;
        std::cout << "clean " << targetCell << '\n';
    }
}
~~~

**Queue invariant:** indices below <code>front</code> are cleaned; indices from <code>front</code> onward are pending.

**Next unlock · L16:** explore choices recursively and undo dead ends.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Compare structures by operation costs, not names

| Requirement | Useful choice |
|---|---|
| scan unsorted readings | array + linear search |
| undo most recent action | stack |
| serve arrival order | queue |
| repeatedly exchange adjacent inversions | array + bubble sort |

    <section data-markdown><textarea data-template>
## Match operations, invariants, and cost before choosing a structure

- An ADT is defined by valid operations and behavior.
- Algorithms are applications of the representation's operations.
- Linear search needs no ordering.
- Stack means LIFO; queue means FIFO.
- Bubble sort is simple but performs quadratic work.
    </textarea></section>
