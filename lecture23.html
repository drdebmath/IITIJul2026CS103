## The key representation determines the buckets. · Sort fixed-width institute IDs by digits

Radix sort exploits the digit structure of integer keys; the stable bucket pass is the algorithmic application.

~~~cpp
#include <array>
#include <vector>

void digitPass(std::vector<int>& values, int place) {
    std::array<std::vector<int>, 10> buckets;
    for (int value : values) buckets[(value / place) % 10].push_back(value);
    std::size_t out = 0;
    for (const auto& bucket : buckets)
        for (int value : bucket) values[out++] = value;
}
~~~

**Takeaways**

- The key representation determines the buckets.
- Stable passes preserve earlier digit order.
- The array of vectors is the structure that makes the algorithm direct.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="23" data-markdown><textarea data-template>
## The general form of a stable counting pass and a recursive decomposition

~~~cpp
int <count>[<radix>] = {};                              // one bucket per key value
for (int <i> = 0; <i> < <n>; ++<i>) ++<count>[<key>(<a>[<i>])];

for (int <d> = 1; <d> < <radix>; ++<d>)                 // prefix sums give each
    <count>[<d>] += <count>[<d> - 1];                   // bucket its end offset

for (int <i> = <n> - 1; <i> >= 0; --<i>)                // right to left keeps it stable
    <out>[--<count>[<key>(<a>[<i>])]] = <a>[<i>];

<result> <solve>(<region>) {
    if (<region is small enough>) return <direct answer>;
    return <combine>(<solve>(<sub-region>), ..., <solve>(<sub-region>));
}
~~~

| Part | Meaning |
| --- | --- |
| `<key>(<x>)` | Extracts the one digit or field this pass sorts on. The key choice is what decides the bucket count. |
| `<radix>` | The number of distinct key values. Cost is one pass over the data plus one over the buckets. |
| stability | Equal keys keep their earlier relative order. Radix sort is only correct because each pass is stable. |
| right-to-left fill | Walking the input backwards while decrementing the offset is what makes the pass stable. |
| `<region is small enough>` | The base case. Sub-regions must be compatible with `<combine>`, or the recursion cannot reassemble the answer. |

Pick the structure from the operation the program actually needs, then let the invariant that structure maintains carry the correctness argument.
    </textarea></section>

## Block recursion reduces matrix multiplication to smaller compatible products

Split each matrix into four blocks, recursively multiply compatible block pairs, and add partial results.

The base case multiplies a sufficiently small block directly. A practical implementation must also handle dimensions that are not powers of two.

    <section data-markdown><textarea data-template>
## Stable buckets let radix sort process one digit at a time

For non-negative decimal integers:

1. distribute by the current digit;
2. collect buckets without changing equal-digit order;
3. move to the next digit.

The queue-like bucket structure supplies stable collection order.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Tree inversion swaps each node’s children recursively

~~~cpp
Node* invert(Node* root) {
    if (root == nullptr) return nullptr;
    Node* left = invert(root->left);
    Node* right = invert(root->right);
    root->left = right;
    root->right = left;
    return root;
}
~~~
    </textarea></section>

A base <code>Piece</code> promises legal-move generation. <code>Rook</code>, <code>Bishop</code>, and <code>Knight</code> implement different movement rules.

## Game evolution: One verified capstone connects every layer

| Final build | Exact parts now connected | Concept provenance |
|---|---|---|
| linked Snake | command → candidate head → collision check → body/food update → ASCII frame | state and loops L02–L06; functions/tests L07–L12; records and links L13–L14; search L17; game object L18 |
| grid Cleaner | 2D world → nearest dirt → parent path → legal move → clean and redraw | arrays/strings L09–L11; queue L15; search comparison L16–L17; class invariant L18 |
| multi-agent graph Cleaner | actors → graph links → distinct reservations → synchronous movement → cleaning | inheritance/polymorphism L19–L21; predicates, ranking, routing, and policy L22 |
| capstone decision | required operation → representation → algorithm → invariant → adversarial test | L23 integration checklist |

**One-turn correctness gate:** every Snake segment is distinct and in bounds; every Cleaner step follows a real grid or graph edge; reserved targets are distinct; dirt never increases and decreases exactly when a target is cleaned.

**Adversarial tests:** tail-cell movement, unreachable dirt, equal-distance targets, one actor, and an already-clean world.

**Run/play:** <code>codes/lecture-23-snake-linked-game.cpp</code>, <code>codes/lecture-23-grid-cleaning-robot.cpp</code>, and <code>codes/lecture-23-multi-agent-graph-cleaning.cpp</code>.

**Final extension:** replay the same verified state trace in terminal, ASCII animation, or HTML/SVG without changing the game rules.
