## for loops, nested loops, and invariants

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## The counter has one clear valid range. · Print a multiplication table without guessing bounds

A counted loop names its start, continuation rule, and update in one place; the loop invariant explains what has already been printed.

~~~cpp
#include <iostream>

int main() {
    int number;
    std::cin >> number;
    for (int multiplier = 1; multiplier <= 10; ++multiplier) {
        std::cout << number << " × " << multiplier
                  << " = " << number * multiplier << '\n';
    }
}
~~~

**Takeaways**

- The counter has one clear valid range.
- The update moves toward termination.
- The invariant describes completed rows.
    </textarea></section>
    <section data-markdown><textarea data-template>
## A for loop makes initialization, bound, and update explicit

~~~cpp
for (int step = 1; step <= 5; ++step) {
    std::cout << step << ' ';
}
~~~

Read it as initialize → test → body → update → test again.
    </textarea></section>
    <section data-markdown><textarea data-template>
## The general form of a for and a nested for

~~~cpp
for (<initialization>; <condition>; <update>) {
    // body, repeated while <condition> stays true
}

for (<outer initialization>; <outer condition>; <outer update>) {
    for (<inner initialization>; <inner condition>; <inner update>) {
        // runs once for every pair of outer and inner values
    }
}
~~~

| Part | Meaning |
| --- | --- |
| <code>&lt;initialization&gt;</code> | Runs once, before the first test. A counter declared here is visible only inside the loop. |
| <code>&lt;condition&gt;</code> | Tested before every iteration, including the first. |
| <code>&lt;update&gt;</code> | Runs after every iteration, before the next test. |
| nesting | The inner loop completes in full for each single iteration of the outer loop. |

The inner loop may depend on the outer counter; that is what makes triangles and tables.
    </textarea></section>

## A correct counter states its valid range

For five zero-based positions, valid indices are 0, 1, 2, 3, 4.

~~~cpp
for (int i = 0; i < 5; ++i) {
    std::cout << i << ' ';
}
~~~

The condition directly states the upper boundary is excluded.

## Nested loops enumerate every coordinate or combination

~~~cpp
for (int row = 0; row < 3; ++row) {
    for (int col = 0; col < 4; ++col) {
        std::cout << row << ',' << col << '\n';
    }
}
~~~

The inner loop completes every column for one row.

    <section class="course-extra-slide course-game-evolution-slide" data-markdown><textarea data-template>
## Game evolution: Rendering turns state into a board

| Today's concept | Exact game part enabled |
|---|---|
| nested for loops | visit every 2D position and choose the symbol to print |

~~~cpp
#include <iostream>
int main() {
    int actorRow=1, actorColumn=3;
    for (int row=0; row<3; ++row) {
        for (int column=0; column<7; ++column) {
            if (row==actorRow && column==actorColumn) std::cout << 'S';
            else std::cout << '.';
        }
        std::cout << '\n';
    }
}
~~~

**Loop invariant:** before row <code>r</code>, every cell in earlier rows has been rendered exactly once.

**Next unlock · L07:** name scoring and movement calculations as testable functions.

## A loop invariant states what stays true after each iteration

Example invariant:

> Before iteration <code>i</code>, positions 0 through <code>i - 1</code> have already been processed.

Check the statement before the first iteration, after one update, and at termination.

    <section data-markdown><textarea data-template>
## Choose for, while, or do-while from the stopping rule

- <code>while</code>: stop when an event or changing condition says so.
- <code>do-while</code>: perform once, then decide.
- <code>for</code>: traverse a known counter range.

The choice communicates intent; any loop can still be written incorrectly.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Boundary tests expose missing or duplicated iterations

~~~cpp
for (int i = 0; i <= 5; ++i)   // six values
for (int i = 5; i >= 0; ++i)   // moves away from stopping
~~~

These are diagnosis examples. Do not run the second loop unchanged.
    </textarea></section>

    <section data-markdown><textarea data-template>
## A correct loop states its range, invariant, and progress

- Put initialization, test, and update together for counted work.
- Nested loops traverse combinations such as rows × columns.
- Write valid values before writing a bound.
- Use an invariant to explain what is already correct.
    </textarea></section>
