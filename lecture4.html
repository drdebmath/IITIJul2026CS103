    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Order branches from exceptional to normal. · Over-current protection controller

A controller must classify current readings and disconnect equipment only when the safety rule is satisfied.

~~~cpp
#include <iostream>

int main() {
    double current, safeLimit;
    bool emergencyStop;
    std::cin >> current >> safeLimit >> emergencyStop;

    if (emergencyStop || current > safeLimit) {
        std::cout << "TRIP: disconnect supply";
    } else if (current > 0.9 * safeLimit) {
        std::cout << "WARNING: near limit";
    } else {
        std::cout << "NORMAL";
    }
}
~~~

**Takeaways**

- Order branches from exceptional to normal.
- Short-circuiting expresses safety logic clearly.
- Every boundary value needs a test.
    </textarea></section>

## A Boolean condition selects a control-flow path

Write the rule before the syntax:

| Current | Emergency stop | Result |
|---:|:---:|---|
| above limit | either | trip |
| within limit | true | trip |
| within limit | false | normal |

Every row should correspond to a test.

## Order branches from exceptional cases to the normal case

~~~cpp
if (emergencyStop || current > safeLimit) {
    std::cout << "TRIP\n";
} else if (current > 0.9 * safeLimit) {
    std::cout << "WARNING\n";
} else {
    std::cout << "NORMAL\n";
}
~~~

Place exceptional and narrower cases before the normal fallback.

## switch selects among cases for one discrete value

~~~cpp
switch (menuChoice) {
case 1: std::cout << "voltage\n"; break;
case 2: std::cout << "current\n"; break;
default: std::cout << "invalid choice\n";
}
~~~

<code>switch</code> is for integral or enumeration values, not numeric ranges.

## Short-circuiting protects operations behind a valid guard

~~~cpp
if (resistance != 0.0 && voltage / resistance > limit) {
    std::cout << "over current\n";
}
~~~

The division runs only when the left condition is true.

## Game evolution: A legal move respects the boundary

| Today's concept | Exact game part enabled |
|---|---|
| switch and guarded branching | translate WASD into a direction and reject a wall crossing |

~~~cpp
int main() {
    int row=2, column=3, dRow=0, dColumn=0; char command='d';
    switch(command) { case 'w': dRow=-1; break; case 's': dRow=1; break;
        case 'a': dColumn=-1; break; case 'd': dColumn=1; break; default: break; }
    int nextRow=row+dRow, nextColumn=column+dColumn;
    bool inside=nextRow>=0 && nextRow<5 && nextColumn>=0 && nextColumn<9;
    if (inside) { row=nextRow; column=nextColumn; }
}
~~~

**Boundary test:** from column 8, command <code>d</code> must leave the actor at column 8.

**Next unlock · L05:** repeat commands until the game ends.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Floating-point comparisons need a problem-chosen tolerance

~~~cpp
double difference = measured - expected;
if (difference < 0.0) {
    difference = -difference;
}
bool nearlyEqual = difference <= tolerance;
~~~

Choose tolerance from the measurement or problem—not one universal constant. A reusable comparison function comes after functions are introduced.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Boundary tests reveal wrong comparisons early

For a safe limit of 10, test:

- normal: 6;
- lower boundary: 0;
- exact boundary: 10;
- just above: 10.01;
- invalid measurement: negative input.

Also test every <code>switch</code> case and its default.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Safe branching names every path and tests every boundary

- Translate decision tables into branches.
- Order branches from exceptional to fallback.
- Use <code>switch</code> only for discrete alternatives.
- Use short-circuiting to guard unsafe work.
- Treat boundary tests as part of implementation.
    </textarea></section>

- **Improvement:** explain one change that would make the solution clearer or safer.

## Accept a move only when it stays in bounds and avoids an obstacle.

**Studio thread:** Make movement safe

| Ask | Today’s answer |
|---|---|
| **Problem** | Accept a move only when it stays in bounds and avoids an obstacle. |
| **Model** | Each attempted move belongs to exactly one outcome class. |
| **Represent** | A decision table maps Boolean conditions to MOVE, BLOCKED, or INVALID. |
| **Solve** | Translate mutually exclusive rows into a carefully ordered branch chain. |
| **Verify** | Test every table row, exact boundary, just-outside value, and default case. |
| **Improve** | Remove overlapping conditions and guard unsafe calculations by short-circuiting. |

**Technique lens:** exhaustive case analysis

**Compare:** nested if statements versus a flat decision table and branch chain
