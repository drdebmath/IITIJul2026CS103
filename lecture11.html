## std::string owns and sizes text safely. · Validate an institute enrollment ID

A useful text rule combines string length, fixed prefixes, and character classification.

~~~cpp
#include <cctype>
#include <iostream>
#include <string>

bool validId(const std::string& id) {
    if (id.size() != 9 || id.substr(0, 2) != "BT") return false;
    for (std::size_t i = 2; i < id.size(); ++i)
        if (!std::isdigit(static_cast<unsigned char>(id[i]))) return false;
    return true;
}

int main() {
    std::cout << std::boolalpha << validId("BT2601034");
}
~~~

**Takeaways**

- std::string owns and sizes text safely.
- Validation is a sequence of explicit predicates.
- cctype functions require careful character conversion.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="11" data-markdown><textarea data-template>
## The general form of std::string construction, measurement, and input

~~~cpp
std::string <name>;                    // empty, size 0
std::string <name> = "<text>";
std::string <name>(<count>, '<ch>');   // <count> copies of one character

<name>.size()                  // number of characters
<name>.empty()                 // true exactly when size() == 0
<name>[<i>]                    // 0 <= <i> < size(), unchecked
<name>.at(<i>)                 // checked: throws std::out_of_range
<name>.substr(<pos>, <length>) // <pos> must satisfy <pos> <= size()
<name>.find("<needle>")        // returns std::string::npos when not found

std::cin >> <name>;                 // one whitespace-delimited word
std::getline(std::cin, <name>);     // the rest of the line, spaces included
~~~

| Part | Meaning |
| --- | --- |
| `<i>` | Zero-based, so the last character is at <code>size() - 1</code>. |
| `substr(<pos>, <length>)` | Takes a position and a <em>length</em>, not two positions. A short tail is truncated, not an error. |
| <code>find</code> | Compare the result against <code>std::string::npos</code>. It is not <code>-1</code>, and it is unsigned. |
| <code>&gt;&gt;</code> vs <code>getline</code> | <code>&gt;&gt;</code> stops at the first space and leaves the newline behind; <code>getline</code> consumes the whole line. |

A <code>std::string</code> owns and sizes its own characters, so length is a question you ask the object rather than compute.
    </textarea></section>

## Game evolution: A replay string stores commands

| Today's concept | Exact game part enabled |
|---|---|
| strings and character validation | store a whole move sequence and reject unknown commands |

~~~cpp
#include <cctype>
#include <string>
int main() {
    std::string replay="wAsD";
    bool valid=true;
    for (std::size_t i=0; valid && i<replay.size(); ++i) {
        unsigned char ch=static_cast<unsigned char>(replay[i]);
        char move=static_cast<char>(std::tolower(ch));
        valid = move=='w' || move=='a' || move=='s' || move=='d';
    }
}
~~~

**Boundary tests:** check the empty replay, one valid character, and one invalid character.

**Next unlock · L12:** turn a replay into a repeatable regression test.

bool valid = id.size() == 9;
valid = valid && id[0] == 'B' && id[1] == 'T';

    <section data-markdown><textarea data-template>
## C-style strings end at a null character and need manual bounds care

A C-style string is a character array ending at the first null character <code>'\0'</code>.

Functions from `<cstring>` cannot discover the capacity of a destination buffer. Prefer <code>std::string</code>; use C strings only when an interface requires them.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Safe text processing prefers ownership, parsing rules, and bounds

- <code>std::string</code> is the default owned text type.
- Check search results and index bounds.
- Use <code>getline</code> for complete lines.
- Character classification requires a safe unsigned value.
- A buffer overflow is undefined behavior, not a recoverable string operation.
    </textarea></section>
