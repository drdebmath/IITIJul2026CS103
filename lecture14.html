# Lecture 14: Dynamic Memory and Linked Lists

    <section class="course-extra-slide course-bridge-slide" data-markdown><textarea data-template>
## Where Lecture 13 ended · Every pointer reached an object that already existed

~~~cpp
std::array<Reading, 3> samples{{
    {1, 30.1, true}, {2, 29.8, true}, {3, 0.0, false}
}};                                          // three records, fixed when you compile

const Reading* found = findSensor(samples, 2);
if (found != nullptr) std::cout << found->value << '\n';
~~~

- A struct groups data members; an array of structs stores many records.
- A pointer holds an address, and we check for `nullptr` before we dereference.
- Every object those pointers reached was declared in the code: it was created when its declaration ran and destroyed at its closing brace.
    </textarea></section>
    <section class="course-extra-slide course-bridge-slide" data-markdown><textarea data-template>
## Two questions Lecture 13 left open · How many records, and for how long?

**How many?** Readings arrive while the program runs. `std::array<Reading, 3>` cannot grow, and you do not know the count when you compile. (Lecture 10's `std::vector` can grow: it keeps its elements on the free store. Today you see how.)

**For how long?** A function that builds a record cannot return the address of a local:

~~~cpp
Reading* makeReading(int id, double v) {
    Reading r{id, v, true};
    return &r;                      // dangling: r is destroyed here
}
~~~

~~~text
warning: address of stack memory associated with local variable 'r' returned
~~~

**Today's answer: the free store.** `new` creates an object that lives until `delete`, and a pointer is how you reach it. That is why pointers came first.

~~~cpp
Reading* makeReading(int id, double v) {
    return new Reading{id, v, true};  // lives until the owner calls delete
}
~~~

Plan: `new` and `delete` → who owns the object (`unique_ptr`) → a linked list that grows one node at a time.
    </textarea></section>

## Example: two lifetimes · A local object and a free-store object

~~~cpp
#include <iostream>

int* makeOnHeap() {
    int* p = new int{42};        // dynamic: lives until delete
    return p;
}

int main() {
    int local = 7;               // automatic: destroyed at the closing brace
    int* heap = makeOnHeap();    // the function ended, the object did not
    std::cout << local << ' ' << *heap << '\n';
    delete heap;                 // the owner releases it
    heap = nullptr;
}
~~~

~~~text
7 42
~~~

    <section class="course-extra-slide course-syntax-slide" data-course-syntax="14" data-markdown><textarea data-template>
## Dynamic memory: the general forms

~~~cpp
<type>* <pointer> = new <type>{<value>};         // one object, initialized
<type>* <pointer> = new <type>[<count>]{...};    // an array of <count> objects
delete <pointer>;                                // release one object
delete[] <pointer>;                              // release an array
~~~

| Part | Meaning |
| --- | --- |
| `new <type>{...}` | Allocates storage on the free store, constructs an object there, and returns its address. |
| `new <type>[n]` | Allocates and constructs `n` objects in one block. The count may be a run-time value. |
| `delete p` | Destroys the object `p` points to and releases its storage. Use it only for storage from `new`. |
| `delete[] p` | The same for an array. Use it only for storage from `new[]`. |
| `p = nullptr;` | After the release, say "no object". Deleting a null pointer is harmless. |

Every `new` needs exactly one matching `delete`. Mixing the two forms is undefined behavior.
    </textarea></section>
    <section data-markdown><textarea data-template>
## new and delete · One object, or an array of objects

~~~cpp
#include <iostream>

int main() {
    int* one = new int{42};              // one int, initialized
    int* many = new int[3]{10, 20, 30};  // three ints
    std::cout << *one << ' ' << many[0] + many[1] + many[2] << '\n';
    delete one;                          // matches new
    delete[] many;                       // matches new[]
    one = nullptr;
    many = nullptr;
}
~~~

~~~text
42 60
~~~

- The free store is separate from the stack: its objects are not destroyed when a scope ends.
- <code>delete[]</code> for <code>new[]</code>, <code>delete</code> for <code>new</code>. The compiler does not check the pairing.
- Set the pointer to <code>nullptr</code> after <code>delete</code>, so a later check can tell that it owns nothing.
    </textarea></section>

## unique_ptr · Exclusive ownership, released automatically

~~~cpp
#include <iostream>
#include <memory>
#include <utility>

int main() {
    auto first = std::make_unique<int>(42);
    std::cout << *first << '\n';
    std::unique_ptr<int> second = std::move(first);   // ownership moves
    std::cout << (first == nullptr) << ' ' << *second << '\n';
}   // second releases the int here
~~~

~~~text
42
1 42
~~~

    <section data-markdown><textarea data-template>
## Ownership errors · Leak, dangling pointer, double deletion

| Error | Example | Result |
|---|---|---|
| Memory leak | `p = new int{7};` while `p` still owns another `int` | the first object is unreachable and never released |
| Dangling pointer | `int* q = p; delete p; *q` | undefined behavior: `q` still holds the address of a dead object |
| Double deletion | `delete p; delete p;` | undefined behavior |
| Mismatched form | `delete` on `new[]` storage, or `delete[]` on `new` | undefined behavior |
| Allocation failure | `new int[huge]` | `new` throws `std::bad_alloc` |

## ALGOL W, 1965 · A reference that refers to no object

- Designing references for the language ALGOL W in 1965, Hoare added the null reference: a value that means "no object".
- He later said he added it "simply because it was so easy to implement".
- C and C++ have the same idea. In C++ it is the null pointer, `nullptr` (Lecture 13).

Following a null reference is an error that the compiler cannot catch for you.
    </textarea></section>
    <section class="course-extra-slide course-story-slide" data-course-story="hoare" data-markdown><textarea data-template>
## "My billion-dollar mistake" · Null marks the end of a list

- In a 2009 talk at QCon London, "Null References: The Billion Dollar Mistake", Hoare called the null reference "my billion-dollar mistake": a rough figure for the damage done by programs that follow a null reference.
- Null is still useful when it has one clear meaning. In a linked list, `next == nullptr` marks the last node.

**Lesson:** check for `nullptr` before you dereference. The loop condition `while (p != nullptr)` does exactly that.
    </textarea></section>

## A linked list · Nodes connected by next pointers

~~~cpp
#include <iostream>

struct Node {
    int value;
    Node* next;              // address of the next node, or nullptr

    std::cout << head->value << ' ' << head->next->value << '\n';
    std::cout << (head->next->next == nullptr) << '\n';
    delete head;
    delete second;
}
~~~

    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Build and summarize a list · Readings inserted at the head

~~~cpp
#include <iostream>

struct Node {
    int value;
    Node* next;
};

Node* pushFront(Node* head, int value) {
    return new Node{value, head};           // the new node points at the old head
}

int sum(const Node* head) {
    int total = 0;
    for (const Node* current = head; current != nullptr; current = current->next) {
        total += current->value;            // every node before current has been added
    }
    return total;
}

void release(Node* head) {
    while (head != nullptr) {
        Node* rest = head->next;            // save the link before the node dies
        delete head;
        head = rest;
    }
}

int main() {
    Node* head = nullptr;
    for (int reading : {31, 29, 33, 30}) {
        head = pushFront(head, reading);
    }
    for (const Node* n = head; n != nullptr; n = n->next) std::cout << n->value << ' ';
    std::cout << '\n';
    std::cout << "sum " << sum(head) << '\n';
    release(head);
    head = nullptr;
    std::cout << "empty sum " << sum(head) << '\n';
}
~~~

~~~text
30 33 29 31
sum 123
empty sum 0
~~~

**Takeaways**

- Insertion at the head takes the same few steps for any length, but it reverses the order: the last reading inserted is the first in the list.
- <code>sum</code> works for the empty list without a special case, because the loop condition fails at once when <code>head</code> is <code>nullptr</code>.
- The caller owns the list and calls <code>release</code> once. Each <code>new</code> in <code>pushFront</code> has one matching <code>delete</code>.
    </textarea></section>

## Releasing a list · Save the next link before you delete

~~~cpp
while (head != nullptr) {
    Node* rest = head->next;     // save the link first
    delete head;                 // the node is gone
    head = rest;                 // continue with the saved link
}
~~~

- Reading <code>head->next</code> after <code>delete head</code> is a use after free: undefined behavior.
- Deleting only <code>head</code> leaks every other node, because their addresses were stored in the deleted node.
- If the links are <code>std::unique_ptr&lt;Node&gt;</code>, destroying the head destroys the whole chain, so no loop is written. A very long chain destroys recursively and can exhaust the stack, so a loop is safer for long lists.
    </textarea></section>
    <section data-markdown><textarea data-template>
## A list function has a pre-condition · The list must not be empty

~~~cpp
#include <cassert>
#include <iostream>

struct Node {
    int value;
    Node* next;
};

// pre-condition: head != nullptr
int front(const Node* head) {
    assert(head != nullptr);
    return head->value;
}

int main() {
    Node a{5, nullptr};
    std::cout << front(&a) << std::endl;
    Node* empty = nullptr;
    std::cout << front(empty) << std::endl;   // violates the pre-condition
}
~~~

~~~text
5
Assertion failed: (head != nullptr), function front, file b3.cpp, line 11.
~~~

The empty list is a normal case for <code>sum</code> and for traversal, so those use a loop condition. <code>front</code> has no answer for an empty list, so the caller must not ask: that is a pre-condition, and <code>assert</code> checks it, as in Lecture 12. The file name in the message is that of the compiled file.
    </textarea></section>

    <section data-markdown><textarea data-template>
## C allocation · malloc and free manage bytes, not objects

~~~cpp
#include <cstdlib>
#include <iostream>

int main() {
    int* values = static_cast<int*>(std::malloc(3 * sizeof(int)));  // 12 untyped bytes
    if (values == nullptr) return 1;                                // malloc reports failure with nullptr
    for (int i = 0; i < 3; ++i) values[i] = (i + 1) * 10;
    std::cout << values[0] + values[1] + values[2] << '\n';
    std::free(values);                                              // free pairs with malloc, not delete
    values = nullptr;
}
~~~

~~~text
60
~~~

- <code>malloc</code> takes a size in bytes and returns <code>void*</code>, so C++ needs a cast. <code>calloc</code> also zeroes the bytes; <code>realloc</code> resizes a block.
- It does not construct or destroy C++ objects, and it never throws: it returns <code>nullptr</code> on failure.
- Pair <code>malloc</code> with <code>free</code>, and <code>new</code> with <code>delete</code>. Never mix them. Use <code>malloc</code> only where a C interface requires it.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Allocation failure · new throws bad_alloc, nothrow returns nullptr

~~~cpp
#include <cstddef>
#include <iostream>
#include <new>

int main() {
    std::size_t count = static_cast<std::size_t>(-1) / 8;   // far more ints than any machine has
    try {
        int* huge = new int[count];
        delete[] huge;
    } catch (const std::bad_alloc& e) {
        std::cout << "allocation failed: " << e.what() << '\n';
    }
    int* maybe = new (std::nothrow) int[count];
    if (maybe == nullptr) std::cout << "nothrow: nullptr\n";
    delete[] maybe;
}
~~~

~~~text
allocation failed: std::bad_alloc
nothrow: nullptr
~~~

By default <code>new</code> does not return <code>nullptr</code>: when storage cannot be provided it throws <code>std::bad_alloc</code>. The <code>std::nothrow</code> form returns <code>nullptr</code> instead, and then the Lecture 13 rule applies: check before you dereference. The text of <code>what()</code> is implementation-specific (here: Apple clang).
    </textarea></section>
    <section data-markdown><textarea data-template>
## Let a tool find the error · AddressSanitizer on a dangling pointer

~~~cpp
int* p = new int{42};
int* q = p;              // a second pointer to the same object
delete p;                // the object dies here
std::cout << *q << '\n'; // q dangles: undefined behavior
~~~

Compiled with <code>g++ -std=c++17 -g -fsanitize=address</code>, the run stops and reports (lines shortened, addresses vary):

~~~text
ERROR: AddressSanitizer: heap-use-after-free on address 0x6020000000f0
READ of size 4 at 0x6020000000f0 thread T0
    #0 ... in main a4.cpp:7
freed by thread T0 here:
    #1 ... in main a4.cpp:6
~~~

- The report names the read of freed memory (line 7) and the line that freed it (line 6).
- Without the sanitizer, the same program ran here and printed <code>4</code>, a value that was not <code>42</code>. The result of such code is undefined: it may print the old value, a different value, or crash.
- A second <code>delete p;</code> is reported the same way as <code>attempting double-free</code>. A leak is found by a leak checker, which this platform's sanitizer does not provide, so no leak report is shown here.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Common dynamic-memory errors

| Error | Example | Result |
|---|---|---|
| Missing `delete` | `new int{1};` with no release | memory leak |
| Losing the only pointer | `p = new int{2};` while `p` owns an object | memory leak |
| Use after delete | `delete p; *p = 3;` | undefined behavior: dangling pointer |
| Double deletion | `delete p; delete p;` | undefined behavior |
| Wrong form | `delete[] p` for `new int{1}`; `delete p` for `new int[3]` | undefined behavior |
| `malloc` with `delete` | `int* p = (int*)std::malloc(4); delete p;` | undefined behavior: pair `malloc` with `free` |
| Reading `next` after `delete` | `delete head; head = head->next;` | undefined behavior: save `next` first |
| Unchecked `nothrow` result | `new (std::nothrow) int[n]` used without a check | null dereference |

Reach for <code>unique_ptr</code> first: it removes the leak, the double deletion, and the wrong form. Compile with <code>-Wall -Wextra</code> and test with <code>-fsanitize=address</code>.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Questions about dynamic memory (1)

| Question | Answer |
|---|---|
| Why not just use a local variable? | A local object ends with its scope and its size is fixed at compile time. Use the free store when the object must outlive the function or its size is known only at run time. |
| Is "heap" the same as "free store"? | In everyday use, yes. The standard says free store for `new`/`delete` and reserves "heap" for the C-style allocator, but both name memory obtained at run time. |
| Does `delete p` set `p` to `nullptr`? | No. It releases the object and leaves `p` holding the old address. Assign `nullptr` yourself. |
| What happens if I forget `delete`? | A memory leak. The storage is returned to the system when the program ends, but a long-running program keeps growing. |
| Can I `delete` a local variable's address? | No. Only storage obtained from `new` may be passed to `delete`. This is undefined behavior. |
| What does `new int` (no braces) contain? | An uninitialized `int`. Write `new int{}` or `new int{42}` so the value is defined. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Questions about dynamic memory (2)

| Question | Answer |
|---|---|
| Why can't I copy a `unique_ptr`? | Two owners would both release the object. Use `std::move` to transfer ownership, or pass the object by reference to share access without ownership. |
| Does `unique_ptr` make dangling impossible? | No. It releases its own object. A raw pointer copied from it with `get()` can still outlive it. |
| Why `make_unique` and not `new`? | It states ownership in one expression and leaves no `new` without an owner. Prefer it. |
| Why a linked list and not an array? | Insertion at the head is cheap and the list grows one node at a time. But the n-th element takes n steps to reach, and each node carries an extra pointer. |
| Can a list be circular? | Yes, if the last `next` points back to the first. Then traversal to `nullptr` never ends, so such a list needs a different stopping rule. |
| Is `malloc` ever correct in C++? | Only when a C interface hands you or demands a `malloc`ed block. For your own objects use `new` or `make_unique`. |
    </textarea></section>
    <section data-markdown><textarea data-template>
## Summary: dynamic memory and linked lists

- Automatic objects end with their scope; free-store objects end at <code>delete</code>, so every one needs an owner.
- <code>new</code> pairs with <code>delete</code>, and <code>new[]</code> with <code>delete[]</code>; <code>malloc</code> pairs with <code>free</code>.
- <code>unique_ptr</code> gives exclusive ownership and automatic release; it cannot stop a dangling observer.
- Leak, dangling pointer, double deletion: each breaks "one owner, one release". By default <code>new</code> throws <code>std::bad_alloc</code>.
- A linked list is nodes joined by <code>next</code> pointers, ending at <code>nullptr</code>; traverse until <code>nullptr</code> and save <code>next</code> before deleting a node.

**Reading:** Stroustrup, *Programming: Principles and Practice Using C++* (2nd ed.), chapters “Vectors and Free Store” and “Vectors and Arrays”; Savitch, *Problem Solving with C++*, “Pointers and Dynamic Arrays” and “Pointers and Linked Lists”.
    </textarea></section>
