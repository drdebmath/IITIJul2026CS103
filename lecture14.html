# Lecture 14: Make dynamic ownership explicit
## Make ownership and lifetime explicit

**Instructor:** [Dr. Debasish Pattanayak](https://drdebmath.github.io)
    </textarea></section>
    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Ownership determines who releases memory. · Ownership-safe linked sample log

Each node exclusively owns the next node, so the complete chain is released automatically.

~~~cpp
#include <iostream>
#include <memory>

struct Node {
    int sample;
    std::unique_ptr<Node> next;
};

int main() {
    auto head = std::make_unique<Node>();
    head->sample = 42;
    head->next = std::make_unique<Node>();
    head->next->sample = 57;
    for (Node* p = head.get(); p; p = p->next.get())
        std::cout << p->sample << " ";
}
~~~

**Takeaways**

- Ownership determines who releases memory.
- Links turn separate allocations into a structure.
- Leaving scope releases the complete owned chain automatically.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="14" data-markdown><textarea data-template>
## The general form of dynamic allocation, ownership, and a node

~~~cpp
<T>* <p> = new <T>(<arguments>);      delete <p>;
<T>* <a> = new <T>[<count>];          delete[] <a>;   // the [] must match

std::unique_ptr<T> <p> = std::make_unique<T>(<arguments>);
// no delete: <p> releases the object when it goes out of scope

struct <Node> {
    <T> <value>;
    <Node>* <next>;        // nullptr marks the end of the chain
};
~~~

| Part | Meaning |
| --- | --- |
| <code>new</code> / <code>delete</code> | Must pair exactly once. Zero deletes leaks; two deletes is undefined behavior. |
| <code>new[]</code> / <code>delete[]</code> | A separate pair. Mixing the two forms is undefined even when it appears to work. |
| dangling pointer | A pointer that outlives what it pointed at. Deleting does not change the pointer's value. |
| <code>unique_ptr</code> | Exclusive ownership tied to scope, so the release cannot be forgotten or repeated. |
| <code>&lt;Node&gt;* &lt;next&gt;</code> | Each node stores where the next one lives, so the sequence needs no contiguous block. |

Ownership is the question to answer first: decide who releases the object, and the matching <code>delete</code> follows from that.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Automatic storage follows scope; dynamic storage follows ownership

Automatic local objects are destroyed when their scope ends. Dynamic storage can outlive the creating scope, so ownership must state who releases it.
    </textarea></section>
    <section data-markdown><textarea data-template>
## new and delete must match the allocated type and ownership

~~~cpp
int* value = new int{42};
std::cout << *value << '\n';
delete value;
value = nullptr;
~~~

Use <code>delete[]</code> only for storage obtained with <code>new[]</code>.
    </textarea></section>

    <section data-markdown><textarea data-template>
## unique_ptr makes exclusive ownership and release explicit

~~~cpp
auto value = std::make_unique<int>(42);
std::cout << *value << '\n';
~~~

A smart pointer releases its owned resource automatically. It prevents ownership leaks, but unrelated non-owning pointers can still dangle.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Leaks, dangling pointers, double deletion, and bad allocation are different defects

- Memory leak: owned storage becomes unreachable without release.
- Dangling pointer: an address remains after the object has died.
- Double deletion: the same allocation is released twice.
- Allocation failure: <code>new</code> normally throws <code>std::bad_alloc</code>.
    </textarea></section>

## Game evolution: Linked ownership lets Snake grow safely

| Today's concept | Exact game part enabled |
|---|---|
| dynamic storage and exclusive ownership | let the body grow as a chain of owned segments |

~~~cpp
#include <memory>
struct Segment { int cell=0; std::unique_ptr<Segment> next; };
int main() {
    auto head=std::make_unique<Segment>();
    head->cell=12;
    head->next=std::make_unique<Segment>();
    head->next->cell=11;
}
~~~

**Ownership invariant:** the head exclusively owns the chain; automatic destruction follows every <code>next</code> link.

**Next unlock · L15:** maintain pending dirt as a queue and search stored cells.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Traversal stops at nullptr after visiting each reachable node

~~~cpp
for (Node* current = head.get(); current != nullptr;
     current = current->next.get()) {
    std::cout << current->value << ' ';
}
~~~

The invariant states that every node before <code>current</code> has been processed.
    </textarea></section>
    <section data-markdown><textarea data-template>
## C allocation exposes bytes, so its ownership contract must be explicit

<code>malloc</code>, <code>calloc</code>, and <code>realloc</code> manage untyped bytes and must be paired with <code>free</code>.

They do not construct or destroy C++ objects. Use them only when a C interface requires them.
    </textarea></section>

    <section data-markdown><textarea data-template>
## Make ownership explicit before allocating or linking

- Dynamic storage requires an ownership rule.
- Prefer <code>unique_ptr</code> for exclusive ownership and automatic release.
- Smart ownership prevents leaks, not every possible dangling observer.
- Linked lists trade contiguous access for explicit links.
    </textarea></section>
