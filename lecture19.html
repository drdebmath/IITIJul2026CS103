## Where Lecture 18 ended · A class owns what it creates

A class can own its data and release it (Lecture 18). Give Lecture 14's node two links, `left` and `right`, and a `BinaryTree` owns a whole tree of them.

A **search tree** needs everything a binary tree has, plus an ordered `insert`.

**Today's question.** Copy the class, or reuse it? Plan: derive one class from another, see the order of construction, control access, and learn when not to inherit.

    <section class="course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="size() came free!"><textarea data-template>
## Inheritance · A SearchTree is a BinaryTree

~~~cpp
class BinaryTree {                       // base class
public:    int size() const;             // counts the nodes
protected: std::unique_ptr<Node> root;   // Node: value, left, right
};
class SearchTree : public BinaryTree {   // derived class
public:    void insert(int v);           // smaller left, larger right
           bool contains(int v) const;
};
void report(const BinaryTree& t) { std::cout << "size " << t.size() << '\n'; }
int main() { SearchTree t;  for (int v : {50, 30, 70, 20}) t.insert(v);
    std::cout << t.size() << ' ' << t.contains(20) << '\n';   // 4 1
    report(t);                                                // size 4
}
~~~

    <section class="course-extra-slide course-syntax-slide" data-course-syntax="19" data-markdown data-mascot-target="table" data-mascot-say="Read the colon as 'is a'."><textarea data-template>
## Public inheritance: the general form

| Part | Meaning |
| --- | --- |
| `class Derived : public Base { ... };` | **Public inheritance**: `Derived` is the **derived class**, `Base` is the **base class**. |
| Inherited members | Every public member of `Base` is a public member of `Derived`; the derived object contains a `Base` part. |
| `Derived(args) : Base(args), member(x) { }` | The **initializer list** constructs the base class first, then the data members. |
| `protected:` | Visible to the class, its derived classes, and its friends; not to other code. |
| `friend` | A friend function may use private and protected members; friendship is not inherited. |
| Private base members | They are in the derived object, but the derived class cannot name them. |
    </textarea></section>
    <section class="course-extra-slide course-big-code course-code-26" data-markdown data-mascot-target="pre" data-mascot-say="Recursion from Lecture 16!"><textarea data-template>
## How `size()` works · Recursion over both subtrees

~~~cpp
class BinaryTree {
public:
    int size() const { return count(root.get()); }   // start at the root
protected:
    std::unique_ptr<Node> root;
private:
    int count(const Node* n) const {                 // nodes in the subtree at n
        if (n == nullptr) return 0;                  // base case: empty subtree
        return 1 + count(n->left.get()) + count(n->right.get());
    }
};
// tree 50, 30, 70, 20:  t.size() returns 4
~~~

<svg class="course-array-address-figure course-l19size-figure" viewBox="0 0 900 380" role="img" aria-label="A step-by-step trace, in 9 frames, of how BinaryTree::size() counts the nodes of the tree 50, 30, 70, 20, where 50 is the root, 30 its left child, 70 its right child, and 20 the left child of 30, with a call stack beside the tree. Frame 1: t.size() runs the inherited size(), which calls count(root.get()). Frame 2: count(50) is pushed; root.get() gives the node pointer without taking ownership. Frame 3: count(50) first counts its left subtree, pushing count(30). Frame 4: count(30) counts its left subtree, pushing count(20). Frame 5: both children of 20 are null, the base case returns 0 for each, so count(20) is 1 plus 0 plus 0, which is 1. Frame 6: count(20) is popped; the right child of 30 is null, so count(30) is 1 plus 1 plus 0, which is 2. Frame 7: count(30) is popped and count(50) counts its right subtree; count(70) is pushed and returns 1 because 70 has no children. Frame 8: count(50) returns 1 plus 2 plus 1, which is 4. Frame 9: size() returns 4 and the call stack is empty again." xmlns="http://www.w3.org/2000/svg">

// Tag(n) prints "construct n"; ~Tag() prints "destroy n" (Lecture 18)
class BinaryTree {
public:
    BinaryTree()  { std::cout << "BinaryTree()\n"; }
    ~BinaryTree() { std::cout << "~BinaryTree()\n"; }
};
class SearchTree : public BinaryTree {

           friend void printRoot(const BinaryTree& t);

};
class SearchTree : public BinaryTree { public: void insert(int v); };

## Barbara Liskov · The substitution property

<div class="course-story-layout">
<div>

- 1987: Barbara Liskov (MIT), "Data Abstraction and Hierarchy", OOPSLA '87.
- Her substitution property: S is a subtype of T if every program written in terms of T behaves the same when an S object is substituted for a T object.
- 2008 ACM A.M. Turing Award.

**Lesson:** derive only if every program written for the base class still works.

</div>
<figure class="course-story-figure">
<img src="assets/lecture-stories/barbara-liskov-2010.jpg" alt="Barbara Liskov in 2010." width="476" height="667" loading="lazy">

## When substitution fails · A base operation breaks the invariant

~~~cpp
class BinaryTree {
public:
    void addLeftmost(int v) {          // any binary tree may grow a leftmost leaf
        std::unique_ptr<Node>* p = &root;
        while (*p) p = &(*p)->left;
        *p = std::make_unique<Node>(Node{v, nullptr, nullptr});
    }
    // ... size(), protected root
};
class SearchTree : public BinaryTree { /* invariant: smaller left, larger right */ };
void grow(BinaryTree& t) { t.addLeftmost(99); }
int main() {
    SearchTree t;
    for (int v : {50, 30, 70}) t.insert(v);
    grow(t);                           // compiles: a SearchTree is a BinaryTree
    std::cout << "size " << t.size() << ", contains(99) " << t.contains(99) << '\n';
}   // size 4, contains(99) 0
~~~

## Has-a uses a data member · Composition

~~~cpp
class Library {                              // has-a: composition
public:
    explicit Library(const std::string& n) : name(n) {}
    void addBook(int id) { ids.insert(id); }
    bool hasBook(int id) const { return ids.contains(id); }
private: std::string name;  SearchTree ids;   // data members, not a base class
};
class BadLibrary : public SearchTree {};      // is-a: wrong here
~~~

**Takeaways:** has-a → a data member. `lib.insert(42)` is a compile error; `bad.insert(42)` compiles.
    </textarea></section>

    <section data-markdown data-mascot-target="table" data-mascot-say="One idea each."><textarea data-template>
## Common errors · Inheritance

| Error | Example | Result |
|---|---|---|
| Forget `public` | `class SearchTree : BinaryTree` | private inheritance: `'size' is a private member of 'BinaryTree'` |
| Name a private base member | `count(root.get());` in `SearchTree` | compile error |
| Base operation the derived class cannot honor | `grow(t)` calls `addLeftmost` | broken invariant; no error message |
| Inherit for has-a | `class BadLibrary : public SearchTree` | exposes every `SearchTree` operation |
| Base without a default constructor | no `Base(args)` in the initializer list | compile error |
    </textarea></section>

    <section data-markdown data-mascot-target="table" data-mascot-say="Ask away!"><textarea data-template>
## Questions about inheritance

| Question | Answer |
|---|---|
| Is the base class's private data in a derived object? | Yes, it is part of the object, but the derived class cannot name it. |
| Is friendship inherited? | No. A friend of `BinaryTree` is not a friend of `SearchTree`. |
| A derived function with the same name as a base function? | It hides the base one; through a `BinaryTree&` the base version runs. Lecture 20: virtual functions. |
| Why not just copy the class? | One copy of the code and of the invariant to maintain. |
| Can a derived class be a base class? | Yes; base and derived classes form a class hierarchy. |
    </textarea></section>
    <section class="course-fill-text-sm" data-markdown data-mascot-target="li:first-child" data-mascot-say="Reuse, with care."><textarea data-template>
## Summary: inheritance

- **Public inheritance** is is-a: pass a `SearchTree` as a `BinaryTree&`.
- The **base class** is constructed first and destroyed last.
- `protected` serves derived classes; a **friend** is not inherited.
- Inherit only if base operations keep the derived **invariant**; else use **composition**.

**Reading:** Stroustrup, *PPP* (2nd ed.), “Graphics Class Design”, section “Base and derived classes”; Savitch, “Inheritance”.
    </textarea></section>
