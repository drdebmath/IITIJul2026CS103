    <section class="course-extra-slide practical-example-slide" data-markdown><textarea data-template>
## Each index stays within its own dimension. · Summarize a classroom score matrix

A matrix needs one loop per dimension; a vector is useful when the number of stored values is known only at runtime.

~~~cpp
#include <iostream>
#include <vector>

int main() {
    std::vector<std::vector<int>> scores{{8, 7, 9}, {6, 10, 8}};
    for (std::size_t row = 0; row < scores.size(); ++row) {
        int total = 0;
        for (std::size_t col = 0; col < scores[row].size(); ++col)
            total += scores[row][col];
        std::cout << "row " << row << " total=" << total << '\n';
    }
}
~~~

**Takeaways**

- Each index stays within its own dimension.
- size() supplies the actual bound.
- The structure matches rows containing columns.
    </textarea></section>
    <section class="course-extra-slide course-syntax-slide" data-course-syntax="10" data-markdown><textarea data-template>
## The general form of a matrix and a std::vector

~~~cpp
<T> <name>[<rows>][<cols>];       // one bound per dimension
<name>[<r>][<c>]                  // needs 0 <= <r> < <rows> AND 0 <= <c> < <cols>

for (int <r> = 0; <r> < <rows>; ++<r>)
    for (int <c> = 0; <c> < <cols>; ++<c>)
        // visits <name>[<r>][<c>] exactly once

std::vector<T> <name>;                    // size 0
std::vector<T> <name>(<count>, <value>);  // <count> copies of <value>

<name>.push_back(<value>);   // appends, size grows by one
<name>.size()                // the current number of elements
<name>[<i>]                  // unchecked, like an array
<name>.at(<i>)               // checked: throws std::out_of_range
~~~

| Part | Meaning |
| --- | --- |
| <code>T</code> | The element type. Write the real type: <code>int</code>, <code>double</code>, <code>std::string</code>. |
| <code>&lt;rows&gt;</code>, <code>&lt;cols&gt;</code> | Independent bounds. Each index must be checked against its own dimension, not against the other. |
| nesting order | The outer index selects the row, the inner walks that row. Swapping them traverses a different shape. |
| <code>size()</code> | A vector carries its own extent, so no separate count parameter is needed. |
| <code>[]</code> vs <code>at()</code> | Both index; only <code>at()</code> checks the bound and reports the failure. |

A vector's size can change at run time, which removes the fixed extent but not the need to stay inside it.
    </textarea></section>
    <section data-markdown><textarea data-template>
## A matrix needs one bound for each dimension

~~~cpp
int image[2][3]{{10, 20, 30}, {40, 50, 60}};
int pixel = image[1][2];  // row 1, column 2
~~~

Both dimensions are zero-based.

## Game evolution: A 2D structure represents the world

| Today's concept | Exact game part enabled |
|---|---|
| two-dimensional arrays | store walls, dirt, and empty cells by row and column |

~~~cpp
#include <iostream>
int main() {
    char world[3][5]{{'#','#','#','#','#'},
                     {'#','*','.','C','#'},
                     {'#','#','#','#','#'}};
    int row=1, column=1;
    if (world[row][column]=='*') world[row][column]='.';
    for (int r=0; r<3; ++r) { for (int c=0; c<5; ++c) std::cout << world[r][c];
        std::cout << '\n'; }
}
~~~

**Invariant:** every access uses one row in [0,3) and one column in [0,5).

    <section data-markdown><textarea data-template>
## std::vector owns a contiguous sequence whose size can change

~~~cpp
#include <vector>

std::vector<int> readings;
readings.push_back(17);
readings.push_back(21);
~~~

The vector grows while preserving contiguous element storage.
    </textarea></section>
    <section data-markdown><textarea data-template>
## Dynamic size does not remove the need for bounds checks

~~~cpp
for (std::size_t i = 0; i < readings.size(); ++i) {
    std::cout << readings.at(i) << '\n';
}
~~~

<code>at()</code> checks; <code>operator[]</code> assumes the index is valid.
    </textarea></section>

## Choose array or vector from size and operation requirements

| Requirement | Representation |
|---|---|
| exactly seven daily readings | fixed array |
| readings until input ends | vector |
| fixed 3 × 3 transform | 2D array |
| rows whose lengths may differ | nested vectors |

## Nested traversal makes each row total testable

~~~cpp
std::vector<std::vector<int>> scores{{8, 7, 9}, {6, 10, 8}};
for (const auto& row : scores) {
    int total = 0;
    for (int score : row) total += score;
    std::cout << total << '\n';
}
~~~

- A vector owns a contiguous sequence whose size is known at runtime.
- <code>size()</code> states the valid upper bound.
