## Domain objects are the data structure’s elements. · Search and rank available flights

The object model supplies flight records; standard algorithms filter and rank those records for a real booking workflow.

~~~cpp
#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

struct Flight { std::string code, from, to; double fare; };

int main() {
    std::vector<Flight> flights{{"AI1", "IDR", "DEL", 5100}, {"AI2", "IDR", "DEL", 4600}};
    std::sort(flights.begin(), flights.end(),
              [](const Flight& a, const Flight& b) { return a.fare < b.fare; });
    auto match = std::find_if(flights.begin(), flights.end(),
              [](const Flight& f) { return f.from == "IDR" && f.to == "DEL"; });
    if (match != flights.end()) std::cout << match->code << " " << match->fare;
}
~~~

**Takeaways**

- Domain objects are the data structure’s elements.
- Comparators encode a user-facing ranking rule.
- Algorithms compose with the object model.
    </textarea></section>

## The general form of a predicate, a comparator, and their algorithms

~~~cpp
auto <predicate> = [](const <T>& <x>) {
    return <condition>;          // must yield bool: one question about one element
};

auto <comparator> = [](const <T>& <a>, const <T>& <b>) {
    return <a>.<key> < <b>.<key>;   // true means "<a> comes strictly before <b>"
};

std::sort(<first>, <last>, <comparator>);
std::stable_sort(<first>, <last>, <comparator>);    // keeps the order of equal elements
std::count_if(<first>, <last>, <predicate>);
std::copy_if(<first>, <last>, std::back_inserter(<out>), <predicate>);
~~~

| Part | Meaning |
| --- | --- |
| `<predicate>` | Names one domain question, so it can be tested on its own and reused by several algorithms. |
| `<comparator>` | Names one ordering policy. Changing how results rank becomes a change in one place. |
| strict weak ordering | `<comparator>(a, a)` must be false. Using <code>&lt;=</code> here lets <code>std::sort</code> run past the end of the range. |
| <code>[]</code> | The capture list. Empty means the lambda uses only its parameters, which keeps it reusable. |
| <code>stable_sort</code> | Preserves the previous order among equal elements, which is what makes ranking by two keys in turn work. |

Give the question and the ordering their own names: a filter and a rank you can test separately are what keep the search readable.
    </textarea></section>

## One component owns one reason to change

- <code>Flight</code>: route, capacity, and availability invariant.
- <code>Passenger</code>: passenger identity and contact value.
- <code>Booking</code>: association between one passenger and one flight.
- <code>BookingSystem</code>: collection operations and policies.

High cohesion keeps each responsibility local.

## A predicate turns a domain question into reusable selection

~~~cpp
auto matchesRoute = [requestedFrom, requestedTo](const Flight& flight) {
    return flight.from == requestedFrom && flight.to == requestedTo;
};

auto result = std::find_if(flights.begin(), flights.end(), matchesRoute);
~~~

The lambda is a predicate: a callable returning true or false. Its capture list copies the two requested city values into the callable.
    </textarea></section>

## A comparator makes ordering policy explicit and testable

~~~cpp
std::sort(flights.begin(), flights.end(),
    [](const Flight& a, const Flight& b) {
        return a.code < b.code;
    });
~~~

The comparator defines one consistent ordering relation.

## Game evolution: A comparator chooses the next target

| Today's concept | Exact game part enabled |
|---|---|
| domain object | one Task records a dirty cell and its route length |
| comparator and sorting | the Cleaner ranks shorter routes first |
| deterministic tie-break | equal routes use row, then column |

~~~cpp
struct Task { int row; int column; int steps; };
std::vector<Task> dirt{{0,4,4},{2,1,3},{4,4,8}};
std::sort(dirt.begin(),dirt.end(),
    [](const Task& a,const Task& b) {
        if (a.steps!=b.steps) return a.steps<b.steps;
        if (a.row!=b.row) return a.row<b.row;
        return a.column<b.column;
    });
Task next{-1,-1,0};
if (!dirt.empty()) next=dirt[0];
~~~

**Invariant/test:** route lengths are nonnegative; after sorting, <code>next</code> is no worse than every remaining task. Test empty, one-task, and equal-distance cases.

**Next unlock · L23:** integrate body, policy, routes, collision rules, and visualization into one verified capstone.
